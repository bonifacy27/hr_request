          description: |
            Метка времени актуальности данных в формате Epoch Unix.
            Используется для поддержки истории изменений. Если значение отсутствует,
            сервер назначает время получения запроса по UTC.
          example: 1613479645000
        foreignKey:
          type: string
          minLength: 1
          maxLength: 36
          description: Идентификатор организационной единицы в системе клиента.
        name:
