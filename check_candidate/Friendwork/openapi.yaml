    JobUpsertRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/JobStatus'
        jobType:
          description: |
            Тип вакансии. `id` и `name` являются взаимоисключающими идентификаторами:
            передавайте только одно из этих полей.

            Тип вакансии должен принадлежать клиенту, от имени которого выполняется запрос.
          allOf:
            - $ref: '#/components/schemas/JobType'
        name:
          type: string
          nullable: true
          description: Наименование вакансии.
        description:
          type: string
          nullable: true
          description: Описание вакансии.
        comment:
          type: string
          nullable: true
          description: Комментарий.
        fromDate:
          type: string
          nullable: true
          description: Дата открытия вакансии. При некорректном формате даты значение игнорируется.
        toDate:
          type: string
          nullable: true
          description: Фактическая дата закрытия вакансии. При некорректном формате даты значение игнорируется.
        plannedToDate:
          type: string
          nullable: true
          description: Плановая дата закрытия вакансии. При некорректном формате даты значение игнорируется.
        responsibleAccount:
          description: |
            Учётная запись ответственного рекрутера. Учётная запись должна принадлежать
            клиенту, от имени которого выполняется запрос.
          allOf:
            - $ref: '#/components/schemas/AccountReference'
        employeeAccounts:
          type: array
          nullable: true
          description: Учётные записи сотрудников.
          items:
            $ref: '#/components/schemas/AccountReference'
        teamMembers:
          type: array
          nullable: true
          description: |
            Участники команды вакансии. Учетная запись и функция каждого участника должны
            принадлежать клиенту, от имени которого выполняется запрос.
          items:
            $ref: '#/components/schemas/TeamMemberReference'
        suspensePeriods:
          type: array
          nullable: true
          description: Периоды приостановки вакансии.
          items:
            $ref: '#/components/schemas/SuspensePeriod'
        positionCount:
          type: integer
          format: int32
          minimum: 1
          description: Количество позиций в вакансии. Значение должно быть положительным.
