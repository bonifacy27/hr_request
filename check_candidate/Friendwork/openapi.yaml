  /candidateDisqualifications:
    post:
      tags:
        - Отказы
      summary: Выставление отказа кандидату
      operationId: createCandidateDisqualification
      description: |
        Выставляет кандидату отказ по указанной вакансии.

        Запрос может быть выполнен, если одновременно соблюдены условия:

        - кандидат существует и принадлежит компании;
        - у кандидата есть активный статус по указанной вакансии;
        - по этой истории кандидата ещё нет активного отказа;
        - причина отказа существует и находится в активном состоянии.

        Причина отказа передается объектом `disqualificationReason`. В нем нужно заполнить
        ровно один идентификатор причины: `id` или `name`.

        API возвращает `400 Bad Request`, если кандидат или вакансия не найдены, у кандидата нет
        активного статуса по вакансии, отказ уже выставлен или передана некорректная причина отказа.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCandidateDisqualificationRequest'
            example:
              candidateId: 123
              jobId: 456
              disqualificationReason:
                name: Не прошел интервью
              comment: Комментарий к отказу
      responses:
        '200':
          description: Отказ выставлен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedCandidateDisqualificationResponse'
              example:
                CandidateId: 123
                CandidateDisqualificationId: 445
                CandidateHistoryId: 23
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenViewJobs'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /candidateDisqualifications/{id}:
    put:
      tags:
        - Отказы
      summary: Изменение отказа кандидата
      operationId: updateCandidateDisqualification
      description: |
        Изменяет причину и комментарий ранее выставленного отказа кандидата.

        Параметр `id` определяет отказ, а `candidateHistoryId` должен принадлежать этому же отказу.
        Если идентификаторы относятся к разным отказам, API возвращает `400 Bad Request`.

        При создании отказа эти значения возвращаются в полях `CandidateDisqualificationId`
        и `CandidateHistoryId`, а в списке отказов — в полях `id` и `candidateHistoryId`.
        API также возвращает `400 Bad Request`, если причина отказа не найдена или архивирована.
      parameters:
        - $ref: '#/components/parameters/CandidateDisqualificationIdPath'
        - $ref: '#/components/parameters/CandidateHistoryIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCandidateDisqualificationRequest'
            example:
              disqualificationReason:
                name: Не прошел интервью
              comment: Комментарий к отказу
      responses:
        '200':
          description: Отказ обновлен.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenViewJobs'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Отказы
      summary: Отмена отказа кандидата
      operationId: deleteCandidateDisqualification
      description: |
        Отменяет ранее выставленный отказ кандидата.

        Параметр `id` определяет отказ, а `candidateHistoryId` должен принадлежать этому же отказу.
        Если идентификаторы относятся к разным отказам, API возвращает `400 Bad Request`.

        При создании отказа эти значения возвращаются в полях `CandidateDisqualificationId`
        и `CandidateHistoryId`, а в списке отказов — в полях `id` и `candidateHistoryId`.
      parameters:
        - $ref: '#/components/parameters/CandidateDisqualificationIdPath'
        - $ref: '#/components/parameters/CandidateHistoryIdQuery'
      responses:
        '200':
          description: Отказ отменен.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenViewJobs'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /candidateDisqualifications/candidates/{candidateId}:
    get:
      tags:
