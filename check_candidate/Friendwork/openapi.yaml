      nullable: true
      description: Тип вакансии. В запросах тип должен принадлежать текущему клиенту.
      properties:
        id:
          type: integer
          format: int32
          nullable: true
          description: Идентификатор типа вакансии.
        name:
          type: string
          nullable: true
          description: Наименование типа вакансии.
    CustomerReference:
      type: object
      description: Заказчик. В запросах заказчик должен принадлежать текущему клиенту.
      properties:
        id:
          type: integer
          format: int32
          nullable: true
          description: Идентификатор заказчика.
        name:
          type: string
          nullable: true
          description: Название заказчика.
    AccountReference:
      type: object
      description: Учетная запись. В запросах учетная запись должна принадлежать текущему клиенту.
      properties:
        id:
          type: integer
          format: int32
          nullable: true
          description: Идентификатор учётной записи.
        userName:
          type: string
          nullable: true
          description: Логин пользователя.
    Account:
      allOf:
        - $ref: '#/components/schemas/AccountReference'
        - type: object
          properties:
            firstName:
              type: string
              nullable: true
              description: Имя пользователя.
            lastName:
              type: string
              nullable: true
              description: Фамилия пользователя.
    TeamMemberReference:
      description: |
        Участник команды вакансии. В запросах его учетная запись и функция должны принадлежать
        текущему клиенту.
      allOf:
        - $ref: '#/components/schemas/AccountReference'
        - type: object
          properties:
            functionTypeId:
              type: integer
              format: int32
              nullable: true
              description: Идентификатор функции участника команды текущего клиента.
            functionTypeName:
              type: string
              nullable: true
              description: Наименование функции участника команды текущего клиента.
    TeamMember:
      allOf:
        - $ref: '#/components/schemas/TeamMemberReference'
        - type: object
          properties:
            firstName:
              type: string
              nullable: true
              description: Имя пользователя.
            lastName:
              type: string
              nullable: true
              description: Фамилия пользователя.
    SuspensePeriod:
      type: object
      properties:
        fromDate:
          type: string
          nullable: true
          description: Дата начала периода приостановки.
        toDate:
          type: string
          nullable: true
          description: Дата окончания периода приостановки.
        comment:
          type: string
          nullable: true
          description: Комментарий к периоду приостановки.
        suspendReason:
          type: string
          nullable: true
          description: Причина приостановки.
    SuspensePeriodResponse:
      type: object
      properties:
        fromDate:
          type: string
          nullable: true
          description: |
            Дата начала периода приостановки в формате `ddd MMM dd yyyy`, например
            `Mon Mar 23 2020`. Названия дней недели и месяцев передаются на английском языке.
          example: Mon Mar 23 2020
        toDate:
          type: string
          nullable: true
          description: |
            Дата окончания периода приостановки в формате `ddd MMM dd yyyy`, например
            `Mon Mar 23 2020`. Названия дней недели и месяцев передаются на английском языке.
          example: Mon Mar 23 2020
        comment:
          type: string
          nullable: true
          description: Комментарий к периоду приостановки.
        suspendReason:
          type: string
          nullable: true
          description: Причина приостановки.
    OrganizationStructureItemIdentifierRequest:
      type: object
      description: |
        Идентификатор подразделения или штатной единицы.

        Передавайте только одно из полей: `id` или `foreignKey`.
      properties:
        id:
          type: integer
          format: int32
          nullable: true
          description: Идентификатор объекта в FriendWork.
        foreignKey:
          type: string
          nullable: true
          description: Внешний ключ объекта в системе клиента.
    OrganizationUnitIdentifierResponse:
      type: object
      nullable: true
      description: Подразделение, связанное с вакансией.
      properties:
        id:
          type: integer
          format: int32
          description: Идентификатор объекта в FriendWork.
        name:
          type: string
          nullable: true
          description: Название подразделения.
        foreignKey:
          type: string
          nullable: true
          description: Внешний ключ объекта в системе клиента.
    StaffPositionIdentifierResponse:
      type: object
      description: Штатная единица, связанная с вакансией.
      properties:
        id:
          type: integer
          format: int32
          description: Идентификатор объекта в FriendWork.
        name:
          type: string
          nullable: true
          description: Название штатной единицы.
        foreignKey:
          type: string
          nullable: true
          description: Внешний ключ объекта в системе клиента.
    JsonPatchOperation:
      type: object
      required:
        - op
        - path
      properties:
        op:
          type: string
          enum:
            - add
            - replace
            - remove
          description: Операция над полем.
        path:
          type: string
          description: Указатель изменяемого поля, например `/jobType` или `/jobType/name`.
        value:
          description: Значение для операции `add` или `replace`.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: object
              additionalProperties: true
            - type: array
              items: {}
    JobCustomFieldsRequest:
      type: object
      required:
        - CustomFields
      properties:
        ShouldUpdateOnlySpecifiedSystemNames:
          type: boolean
          description: |
            Если `true`, обновляются только поля, явно переданные в `CustomFields`.
            Если `false`, значения неуказанных полей удаляются.
        CustomFields:
          type: array
          description: |
            Список значений настраиваемых полей.

            Поле определяется по `systemName`. Для поля с одним значением передавайте `value`,
            для поля с несколькими значениями — `values`. Не передавайте `value` и `values` одновременно.
          minItems: 1
          items:
            $ref: '#/components/schemas/CustomFieldValue'
    OrganizationStructureCustomFieldValue:
      type: object
      required:
        - systemName
      properties:
        systemName:
          type: string
          minLength: 1
          maxLength: 255
          description: Системное наименование поля.
          example: Key1
        value:
          type: string
          nullable: true
          description: |
            Одно значение поля.

            Используйте для полей типов `Integer`, `String`, `Text`, `TextEditor`, `Select`,
            `SelectWithOther` и `SingleChoice`.
        values:
          type: array
          nullable: true
          description: |
            Несколько значений поля.

            Используйте для полей типа `MultipleChoice`.
          items:
            type: string
    CustomFieldValue:
      type: object
      required:
        - systemName
      properties:
        systemName:
          type: string
          description: Системное наименование поля.
          example: JobCustomField1
        value:
          type: string
          nullable: true
          description: Одно значение поля.
        values:
          type: array
          nullable: true
          description: Несколько значений поля.
          items:
            type: string
    ApiResult:
      type: object
      properties:
        Code:
          type: integer
          format: int32
          description: |
            Код результата обработки:

            - `0` — успешная обработка;
            - `1` — неверный формат запроса;
            - `3` — ошибка данных, например вакансия не найдена или передано некорректное значение поля.
          example: 0
        Message:
          type: string
          nullable: true
          description: Информация об ошибке. В положительном ответе не возвращается.
    OrganizationStructureApiResult:
      type: object
      properties:
        Code:
          type: integer
          format: int32
          description: |
            Код результата обработки:

            - `0` — успешная обработка;
            - `1` — общая ошибка API, например неверный формат запроса;
            - `2` — устаревший код ошибки авторизации. Не используется: если запрос не авторизован,
              API возвращает HTTP-статус `401 Unauthorized`;
            - `3` — ошибка при сохранении или редактировании данных.
          example: 0
        Message:
          type: string
          nullable: true
          description: Информация об ошибке. В успешном ответе обычно имеет значение `null`.
        Body:
          allOf:
            - $ref: '#/components/schemas/BatchTransferStatus'
          description: Информация о трансфере. Возвращается только при использовании пакетного режима.
