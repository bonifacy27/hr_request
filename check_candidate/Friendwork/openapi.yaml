    # Начало работы

    Если вы впервые работаете с FriendWork Recruiter API, начните с этого раздела. Здесь
    описаны назначение API, условия использования, адрес для отправки запросов и пример
    первого запроса.

    > Мы постоянно развиваем FriendWork Recruiter API и улучшаем документацию, чтобы создавать
    > и поддерживать интеграции было проще. Сейчас вы просматриваете новую версию документации.
    >
    > Если вы не нашли здесь нужный метод, параметр или пример, дополнительные сведения могут быть
    > доступны в ранее опубликованных материалах:
    >
    > - [FriendWork Recruiter API](https://docs.google.com/document/d/1g5f4r8yCVJ1ToWTzZ-nDEbrJ6M3IJbtkbkt6trVE4m8/edit?tab=t.0)
    > - [FriendWork Recruiter API. Вакансии](https://docs.google.com/document/d/17T__-z9BOMPDOuWhYPhb45CGQOLMftucauCNYkBID_w/edit?tab=t.0#heading=h.jxobb0rvzqtr)
    > - [FriendWork Recruiter API. Организационно-штатная структура](https://docs.google.com/document/d/1GP1BiTkb6-UC1o_ibWHVp23NfBVjZkJuq1FKR1ksP64/edit?tab=t.0#heading=h.y88rmx21oun9)
    > - [Получение отклика из формы во FriendWork — пример для Tilda](https://help.friend.work/article/11661)

    ## Что такое FriendWork Recruiter API

    FriendWork Recruiter — система управления подбором персонала, в которой компании ведут
    вакансии, работают с кандидатами и управляют процессом найма.

    FriendWork Recruiter API предназначен для интеграции FriendWork с внешними системами и
    автоматизации процессов, которые иначе потребовали бы ручной работы в интерфейсе приложения.

    С помощью API можно:

    - создавать и обновлять кандидатов, передавать резюме и обрабатывать найденные дубликаты;
    - добавлять и получать события кандидатов, изменять их статусы и работать с откликами и отказами;
    - создавать, получать, изменять и удалять вакансии, включая связанные настраиваемые поля;
    - получать публикации вакансий, категории и специализации;
    - синхронизировать организационную структуру компании: подразделения, штатные единицы,
      сотрудников и назначения;
    - получать сведения об аккаунтах, их ролях и настройках;
    - настраивать вебхуки для получения уведомлений о событиях во FriendWork;
    - интегрировать FriendWork с карьерными порталами, HR-системами (HRM/HRIS),
      корпоративными системами и другими внешними сервисами.

    Интеграция может сочетать обычные HTTP-запросы и вебхуки. Внешняя система отправляет
    запросы в FriendWork и получает ответы в формате JSON, а вебхуки позволяют получать
    уведомления о значимых событиях без постоянного опроса API.

    FriendWork Recruiter API не является полным зеркалом пользовательского интерфейса.
    Поддерживаемой частью публичного контракта считаются методы, параметры и модели, описанные
    в этой документации. Доступность конкретных операций зависит от подключённых для компании
    возможностей и прав пользователя.

    ## Условия использования

    Использование API регулируется «УСЛОВИЯМИ ИСПОЛЬЗОВАНИЯ API FRIENDWORK RECRUITER»,
    размещёнными по адресу: [УСЛОВИЯ ИСПОЛЬЗОВАНИЯ API FRIENDWORK RECRUITER](https://friend.work/api).
    Любое использование означает ваше согласие с ними.

    ## Базовый URL

    Базовый URL — `https://api.friend.work/`. Пути методов указываются относительно этого адреса.
    Например, полный адрес метода `POST /jobs` — `https://api.friend.work/jobs`.

    ## Быстрый старт

    В этом разделе приведены два минимальных сценария для проверки интеграции: создание
    вакансии и создание кандидата. Каждый пример содержит адрес метода, необходимые заголовки,
    минимальное тело запроса и пример успешного ответа.

    Для выполнения запросов нужен действующий API-токен пользователя с правами на
    соответствующую операцию.

    Перед отправкой замените значения полей актуальными данными вашей компании. Запросы создают
    реальные объекты в FriendWork Recruiter, поэтому не используйте случайные или тестовые
    данные в рабочей базе.

    ### Создание вакансии

    Метод `POST /jobs` создаёт новую вакансию в FriendWork Recruiter. В запросе можно указать
    название и статус вакансии, количество позиций, ответственного рекрутера, категорию,
    даты открытия и закрытия, а также связь с организационной структурой.

    В базовом примере создаётся вакансия «Backend-разработчик» в статусе `open`
    с одной позицией:

    ```bash
    curl --request POST 'https://api.friend.work/jobs' \
      --header 'Authorization: Bearer {apiToken}' \
      --header 'Content-Type: application/json' \
      --data '{
        "status": "open",
        "name": "Backend-разработчик",
        "positionCount": 1
      }'
    ```

    В случае успеха API возвращает `200 OK` и идентификатор созданной вакансии:

    ```json
    {
      "id": 12345
    }
    ```

    ### Создание кандидата

    > **Скоро появится.** В этом разделе будет опубликован пример создания кандидата.

    ## Поддержка и обратная связь

    Если у вас возникли вопросы по работе с API или вы обнаружили неточность в документации,
    напишите на [support@friend.work](mailto:support@friend.work) или обратитесь в поддержку
    через основное приложение FriendWork Recruiter.

    # Общие правила работы с API

    В этом разделе описаны общие требования к авторизации, форматам данных, надёжности
    запросов, ограничениям частоты и обработке ошибок. Эти правила применяются ко всем
    методам API, если в описании конкретного метода не указано иное.

    ## Авторизация и права доступа

    FriendWork Recruiter API выполняет запросы от имени пользователя, для которого выпущен
    API-токен. Токен не расширяет права пользователя: доступны только те операции и данные,
    к которым пользователь имеет доступ в FriendWork Recruiter.

    Передавайте API-токен в каждом запросе в заголовке `Authorization`:

    ```http
    Authorization: Bearer {apiToken}
    ```

    Передавайте токен только в заголовке `Authorization`. Не добавляйте его в URL или тело
    запроса.

    API-токен является секретом. Храните его в защищённом хранилище, не публикуйте в исходном
    коде и не записывайте в логи.

    Если заголовок отсутствует, схема отличается от `Bearer`, токен пустой, недействительный,
    истёк или отозван, API возвращает `401 Unauthorized` и заголовок
    `WWW-Authenticate: Bearer`.

    Если токен действителен, но у пользователя нет права на выполнение операции, API возвращает
    `403 Forbidden`. Необходимые права зависят от конкретного метода.

    ## Формат запросов и ответов

    Все запросы к API выполняются по протоколу HTTPS.

    Если запрос содержит тело, по умолчанию передавайте его в формате JSON с кодировкой UTF-8
    и заголовком:

    ```http
    Content-Type: application/json
    ```

    Если метод использует другой тип содержимого, он указывается в его описании. Например,
    для операций JSON Patch может использоваться `application/json-patch+json`.

    Используйте имена, регистр и типы полей, указанные в схеме метода. Числа и логические
    значения передавайте как соответствующие типы JSON, а не как строки, если в схеме явно
    не указано иное.

    Отсутствующее поле и поле со значением `null` могут обрабатываться по-разному. Учитывайте
    описание конкретного метода, особенно при полном и частичном изменении объектов.

    Успешный запрос возвращает HTTP-статус, указанный в описании метода. В зависимости от
    операции ответ может содержать JSON или не иметь тела.

    Примеры показывают один из допустимых вариантов запроса или ответа и могут содержать
    не все доступные поля. Полный контракт определяется схемой и описанием метода.

    ## HTTP-статусы и ошибки

    API сообщает результат обработки запроса с помощью HTTP-статуса. Сначала проверяйте статус
    ответа, а затем обрабатывайте его тело.

    | Статус | Значение |
    | --- | --- |
    | `200 OK` | Запрос успешно обработан. У исторических методов ответ может содержать JSON или не иметь тела. |
    | `201 Created` | Ресурс создан. |
    | `204 No Content` | Запрос успешно обработан, тело ответа отсутствует. |
    | `400 Bad Request` | Запрос имеет неверный формат или содержит некорректные данные. |
    | `401 Unauthorized` | API-токен отсутствует, недействителен, истёк или отозван. |
    | `403 Forbidden` | Токен действителен, но у пользователя нет права на выполнение операции. |
    | `404 Not Found` | Запрошенный объект или маршрут не найден. |
    | `409 Conflict` | Запрос конфликтует с текущим состоянием ресурса или создаёт дубликат. |
    | `429 Too Many Requests` | Превышено ограничение частоты запросов. |
    | `5xx` | Произошла внутренняя или временная ошибка API либо инфраструктуры. |

    Точный набор возможных статусов и наличие тела ответа указываются в описании конкретного
    метода.

    У исторических методов формат тела ошибки может различаться. Ответ может не иметь тела
    или содержать JSON в формате, указанном в описании конкретного метода.

    Новые версионные методы возвращают ошибки в формате `application/problem+json`:
    `ProblemDetails` используется для общих и бизнес-ошибок, а `ValidationProblemDetails` —
    для ошибок валидации. Состав полей и возможные статусы приводятся в описании метода.

    Чтобы поддержка могла быстрее найти проблемный запрос, укажите в обращении HTTP-метод,
    URL, статус ответа, дату и время запроса, а также значение `X-Trace-Id` из ответа, если оно
    присутствует. Не включайте API-токен в обращение.

    ## Ограничения частоты запросов

    Для каждого API-токена одновременно действуют два ограничения:

    - не более 2 запросов в секунду;
    - не более 120 запросов в минуту.

    Если один API-токен используют несколько экземпляров интеграции, их запросы учитываются
    вместе. Даже если минутный лимит не исчерпан, API может отклонить запрос при превышении
    допустимого количества запросов в течение одной секунды.

    Ограничения распространяются на все методы API, если в описании конкретного метода
    не указано иное. Учитывайте при подсчёте также повторные попытки.

    При превышении любого из ограничений API возвращает `429 Too Many Requests`. Не повторяйте
    такой запрос немедленно: приостановите отправку и используйте правила из раздела
    «Надёжность и повторные запросы».

    ## Надёжность и повторные запросы

    Устанавливайте таймаут ожидания ответа не менее 60 секунд.

    Если клиент не получил ответ из-за таймаута или сетевого сбоя, это не означает, что запрос
    не был обработан. Сервер мог завершить операцию до разрыва соединения.

    Повторный запрос может быть оправдан в следующих случаях:

    - ответ не получен из-за временного сетевого сбоя;
    - API вернул `429 Too Many Requests`;
    - API вернул временную серверную ошибку `5xx`.

    Не повторяйте запрос автоматически при ошибках `400`, `401`, `403`, `404` или `409`. Сначала
    исправьте запрос, авторизацию, права доступа, идентификатор объекта или причину конфликта.

    Для повторных попыток используйте экспоненциальное увеличение задержки: 1 минута,
    2 минуты, 4 минуты, 8 минут, 16 минут и 32 минуты. Добавляйте небольшое случайное
    отклонение, чтобы несколько интеграций не отправляли повторные запросы одновременно.

    Ограничивайте количество автоматических повторов. Если запрос продолжает завершаться ошибкой
    после последней попытки, прекратите автоматические повторы и зафиксируйте ошибку для диагностики.

    Будьте осторожны с запросами, которые создают или изменяют данные. Повторный вызов может
    создать дубликат или повторно выполнить операцию. Например, повторный `POST /jobs` может
    создать ещё одну вакансию.

    ## Версионирование и обратная совместимость

    В FriendWork Recruiter API есть исторически сложившиеся методы, URL которых не содержит
    номера версии. Эти методы продолжат работать по существующим адресам и не будут переноситься
    на версионные URL.

    Новые методы API будут публиковаться с номером основной версии в URL в следующем формате:

    ```http
    /api/v{major}/{resource}
    ```

    ### Версии API

    В URL используется только номер основной версии: `v1`, `v2` и так далее. Обратно совместимые
    изменения выпускаются в рамках текущей версии и не изменяют адрес метода.

    Изменения, которые могут нарушить работу существующих интеграций, выпускаются в новой основной
    версии API. Например, методы `/api/v1/{resource}` и `/api/v2/{resource}` относятся к разным
    версиям контракта.

    ### Обратная совместимость

    К обратно совместимым изменениям относятся:

    - добавление новых методов;
    - добавление необязательных параметров и полей запроса;
    - добавление новых полей в ответ;
    - уточнение описаний и примеров без изменения контракта.

    При обработке ответов рекомендуется игнорировать неизвестные поля. Это позволит интеграции
    продолжить работу после расширения ответа новыми данными.

    Новая основная версия выпускается, если требуется:

    - удалить или переименовать метод, параметр либо поле;
    - сделать необязательное поле обязательным;
    - изменить тип или назначение существующего поля;
    - изменить структуру запроса или ответа;
    - изменить поведение метода так, что существующая интеграция потребует доработки.

    > Версия, указанная в заголовке этой документации, обозначает версию OpenAPI-описания.
    > Она не определяет версию методов и не добавляется в URL запроса.

    # Типичные сценарии использования

    В этом разделе собраны пошаговые сценарии работы с API.
    Точные параметры, ограничения и контракты запросов приведены в описаниях соответствующих методов.

    ## Получение уведомлений об изменениях кандидатов и вакансий через HTTP-вебхуки

    Вебхуки позволяют получать изменения FriendWork Recruiter без постоянного опроса API.
    В этом сценарии показано, как создать HTTP-вебхук и обработать основные виды событий.

    ### Подготовка обработчика

    Подготовьте HTTP- или HTTPS-адрес, доступный для исходящих запросов FriendWork.
    Для production рекомендуется использовать HTTPS.
    Обработчик должен быть идемпотентным: при ошибке доставки один и тот же payload может прийти повторно.

    ### Создание HTTP-вебхука

    Пример создаёт HTTP-вебхук, который получает уведомления о создании и редактировании
    записей ленты кандидата:

    ```bash
    curl --request POST 'https://api.friend.work/webhooks' \
      --header 'Authorization: Bearer {apiToken}' \
      --header 'Content-Type: application/json' \
      --data '{
        "name": "Создание и редактирование записей ленты кандидата",
        "url": "https://example.com/webhook",
        "authorization": "Bearer {webhookToken}",
        "method": 1,
        "type": 1,
        "rule": 2,
        "additionalData": 1,
        "dataItems": ["webhook.name", "event"]
      }'
    ```

    `{apiToken}` авторизует запросы интеграции к FriendWork API. Значение
    `{webhookToken}` FriendWork передаёт вашему обработчику в заголовке `Authorization`.
    Используйте для них разные токены.

    Значения `type`, `method`, `rule`, `additionalData` и `dataItems`, а также ограничения их
    совместного использования описаны в разделе «Вебхуки».

    В успешном ответе возвращается идентификатор созданного вебхука:

    ```json
    {
      "id": 444
    }
    ```

    ### Проверка созданного вебхука

    Получите список вебхуков и найдите созданную конфигурацию по значению `id`:

    ```bash
    curl --request GET 'https://api.friend.work/webhooks' \
      --header 'Authorization: Bearer {apiToken}'
    ```

    В ответе созданный вебхук будет одним из элементов массива. Пример сокращён:

    ```json
    [
      {
        "id": 444,
        "name": "Создание и редактирование записей ленты кандидата",
        "url": "https://example.com/webhook",
        "authorization": "Bearer {webhookToken}",
        "method": 1,
        "type": 1,
        "rule": 2,
        "additionalData": 1,
        "dataItems": ["webhook.name", "event"]
      }
    ]
    ```

    Каждый следующий пример использует отдельную конфигурацию вебхука. Не применяйте настройки
    одного примера к другому без проверки значений `rule`, `additionalData` и `dataItems`.

    Примеры сокращены для читаемости: реальные `candidate`, `candidateHistory` и `job` могут
    содержать дополнительные поля. Поля `null` не отправляются.

    ### Получение изменений ленты кандидата

    Для получения изменений статусов и комментариев выберите подходящее правило срабатывания:
    `None`, `OnlyOnAdd`, `FireOnAnyStatus` или `OnHistoryDeleted`. Их точное поведение описано
    в подразделе «Правила для ленты кандидата».

    #### 1. Создание статуса на вакансии

    Настройка: `type: 1`, `method: 1`, `rule: 2` (`FireOnAnyStatus`), `additionalData: 0`,
    `dataItems: ["event"]`.

    ```json
    {
      "candidateHistory": {
        "candidateHistoryId": 500,
        "statusId": 5,
        "jobId": 42,
        "jobName": "Frontend-разработчик",
        "name": "Интервью",
        "fromDate": "20.03.2026 14:00",
        "description": "Техническое интервью",
        "candidateId": 100,
        "accountId": 10,
        "responsibleId": 25
      },
      "event": {
        "action": "created",
        "entity": "candidateHistory",
        "candidateHistory": {
          "entityType": "status",
          "isActive": true
        }
      }
    }
    ```

    #### 2. Редактирование статуса и смена подстатуса

    Настройка: `type: 1`, `method: 1`, `rule: 2` (`FireOnAnyStatus`), `additionalData: 0`,
    `dataItems: ["event"]`. Если использовать `rule: 1` (`OnlyOnAdd`), такое редактирование
    не вызовет вебхук.

    ```json
    {
      "candidateHistory": {
        "candidateHistoryId": 510,
        "statusId": 15,
        "jobId": 42,
        "name": "Интервью состоялось",
        "candidateId": 100
      },
      "event": {
        "action": "updated",
        "entity": "candidateHistory",
        "changes": {
          "candidateStatusId": {
            "old": 5,
            "new": 15
          }
        },
        "candidateHistory": {
          "entityType": "status",
          "isActive": true
        }
      }
    }
    ```

    #### 3. Редактирование комментария

    Настройка: `type: 1`, `method: 1`, `rule: 2` (`FireOnAnyStatus`), `additionalData: 0`,
    `dataItems: ["event"]`. `FireOnAnyStatus` срабатывает и на комментарии.

    ```json
    {
      "candidateHistory": {
        "candidateHistoryId": 515,
        "jobId": 0,
        "isAllDay": false,
        "description": "Внутренняя заметка рекрутера",
        "accountId": 10,
        "responsibleId": 25,
        "additional": [],
        "candidateId": 100
      },
      "event": {
        "action": "updated",
        "entity": "candidateHistory",
        "changes": {},
        "candidateHistory": {
          "entityType": "comment",
          "isActive": false
        }
      }
    }
    ```

    #### 4. Удаление записи из ленты

    Настройка: `type: 1`, `method: 1`, `rule: 5` (`OnHistoryDeleted`), `additionalData: 0`,
    `dataItems: ["candidate.activeStatuses", "event"]`.

    ```json
    {
      "candidateHistory": {
        "candidateHistoryId": 500,
        "statusId": 5,
        "jobId": 42,
        "name": "Интервью",
        "candidateId": 100
      },
      "candidate.activeStatuses": [
        {
          "candidateStatusId": 1,
          "jobId": 42,
          "candidateHistoryId": 450,
          "statusName": "Новый"
        }
      ],
      "event": {
        "action": "deleted",
        "entity": "candidateHistory",
        "candidateHistory": {
          "entityType": "status",
          "isActive": true
        }
      }
    }
    ```

    `candidateHistory` содержит снимок удалённой записи; `candidate.activeStatuses` — актуальное
    состояние после удаления. Для комментария `entityType` равен `comment`, а `isActive` — `false`.

    ### Получение изменений карточки кандидата

    Для создания, обновления и удаления карточки используйте соответствующее правило события.
    Создание может происходить как для новой карточки, так и при создании кандидата с вакансией
    или из отклика. Подробные условия приведены в разделе «Вебхуки».

    Настройка: `type: 1`, `method: 1`, `additionalData: 1`,
    `dataItems: ["event"]`. `rule: 6` (`OnCandidateCreated`) соответствует `created`,
    `rule: 7` (`OnCandidateUpdated`) — `updated`, `rule: 8` (`OnCandidateDeleted`) — `deleted`.

    ```json
    {
      "candidate": {
        "candidateId": 100,
        "firstName": "Иван",
        "lastName": "Петров"
      },
      "event": {
        "action": "created",
        "entity": "candidate"
      }
    }
    ```

    ### Обработка объединения кандидатов

    Настройка: `type: 1`, `method: 1`, `rule: 9` (`OnCandidateMerged`), `additionalData: 1`,
    `dataItems: ["candidate.histories", "candidate.activeStatuses", "event"]`.

    ```json
    {
      "candidate": {
        "candidateId": 100,
        "firstName": "Иван",
        "lastName": "Петров"
      },
      "candidate.histories": [
        {
          "candidateHistoryId": 500,
          "statusId": 5,
          "jobId": 42,
          "name": "Интервью",
          "candidateId": 100
        }
      ],
      "candidate.activeStatuses": [
        {
          "candidateStatusId": 5,
          "jobId": 42,
          "candidateHistoryId": 500
        }
      ],
      "event": {
        "action": "merged",
        "entity": "candidate",
        "candidate": {
          "mergedCandidateId": 200
        }
      }
    }
    ```

    `candidate.histories` содержит открытые записи после объединения;
    `candidateHistory` как отдельный блок при `merged` отсутствует.

    ### Получение изменений вакансий

    #### 1. Создание или обновление вакансии

    Настройка: `type: 1`, `method: 1`, `rule: 3` (`OnJobCreated`) для создания или
    `rule: 4` (`OnJobUpdated`) для обновления, `dataItems: ["job", "event"]`.

    ```json
    {
      "job": {
        "jobId": 42,
        "status": "Open",
        "name": "Frontend-разработчик"
      },
      "event": {
        "action": "created",
        "entity": "job"
      }
    }
    ```

    Для создания вакансии `event.action` равен `created`, для обновления — `updated`.

    #### 2. Удаление вакансии

    Настройка: `type: 1`, `method: 1`, `rule: 10` (`OnJobDeleted`),
    `dataItems: ["job", "event"]`.

    ```json
    {
      "job": {
        "id": 42,
        "name": "Frontend-разработчик",
        "status": 1,
        "clientId": 77
      },
      "event": {
        "action": "deleted",
        "entity": "job"
      }
    }
    ```

    Схема `job` при удалении отличается от создания и обновления: используется
    `id`, а `status` имеет числовой тип.

    ### Изменение и удаление вебхука

    Методы `PUT` и `PATCH` для вебхуков отсутствуют. Чтобы изменить конфигурацию,
    удалите существующий вебхук и создайте новый с нужными настройками.

    Удалите вебхук по идентификатору, полученному при создании:

    ```bash
    curl --request DELETE 'https://api.friend.work/webhooks?id=444' \
      --header 'Authorization: Bearer {apiToken}'
    ```

    При успешном удалении API возвращает пустой ответ со статусом `200 OK`.

    ## Синхронизация организационной структуры

    Сценарий подходит для первичной загрузки организационной структуры и её последующего
    регулярного обновления из кадровой или учётной системы.

    **Первичная загрузка**

    Для каждого объекта определите постоянный `foreignKey` — идентификатор объекта в
    системе-источнике. При последующих обновлениях используйте тот же `foreignKey`.

    Объекты рекомендуется передавать в следующем порядке:

    1. организационные единицы — `PUT /Api/Company/OrganizationUnits`;
    2. штатные единицы — `PUT /Api/Company/StaffPositions`;
    3. сотрудники — `PUT /Api/Company/Employees`;
    4. назначения сотрудников на штатные единицы — `PUT /Api/Company/Assignments`.

    API допускает передачу связанных объектов в произвольном порядке и согласует связи после
    получения недостающих объектов. Однако последовательная загрузка упрощает проверку результата
    интеграции и диагностику ошибок.

    Для облачной версии используйте режим немедленного обновления и не передавайте `batchInfo`.
    Выполняйте запросы последовательно и учитывайте ограничение в 2 запроса в секунду.

    **1. Передача организационных единиц**

    Сначала передайте юридическое лицо и входящий в него отдел:

    ```bash
    curl --request PUT 'https://api.friend.work/Api/Company/OrganizationUnits' \
      --header 'Authorization: Bearer {apiToken}' \
      --header 'Content-Type: application/json' \
      --data '{
        "organizationUnits": [
          {
            "timestamp": 1767225600000,
            "foreignKey": "company-1",
            "name": "ООО «Пример»",
            "state": 0,
            "isLegalEntity": true
          },
          {
            "timestamp": 1767225600000,
            "foreignKey": "department-1",
            "name": "Отдел разработки",
            "parentForeignKey": "company-1",
            "state": 0,
            "isLegalEntity": false
          }
        ]
      }'
    ```

    **2. Передача штатных единиц**

    После организационных единиц передайте относящиеся к ним штатные единицы:

    ```bash
    curl --request PUT 'https://api.friend.work/Api/Company/StaffPositions' \
      --header 'Authorization: Bearer {apiToken}' \
      --header 'Content-Type: application/json' \
      --data '{
        "staffPositions": [
          {
            "timestamp": 1767225600000,
            "foreignKey": "position-1",
            "organizationUnitForeignKey": "department-1",
            "organizationUnitAssignedAt": "2026-01-01T00:00:00",
            "name": "Руководитель отдела разработки",
            "createdAt": "2026-01-01T00:00:00",
            "state": 0
          },
          {
            "timestamp": 1767225600000,
            "foreignKey": "position-2",
            "organizationUnitForeignKey": "department-1",
            "organizationUnitAssignedAt": "2026-01-01T00:00:00",
            "lineManagerStaffPositionForeignKey": "position-1",
            "lineManagerAssignedAt": "2026-01-01T00:00:00",
            "name": "Разработчик",
            "createdAt": "2026-01-01T00:00:00",
            "state": 0
          }
        ]
      }'
    ```

    **3. Передача сотрудников**

    Затем создайте или обновите сотрудников:

    ```bash
    curl --request PUT 'https://api.friend.work/Api/Company/Employees' \
      --header 'Authorization: Bearer {apiToken}' \
      --header 'Content-Type: application/json' \
      --data '{
        "employees": [
          {
            "timestamp": 1767225600000,
            "foreignKey": "employee-1",
            "personnelNumber": "1001",
            "hiredAt": "2026-01-01T00:00:00",
            "lastName": "Иванов",
            "firstName": "Иван",
            "middleName": "Иванович",
            "email": "ivanov@example.com",
            "state": 0
          }
        ]
      }'
    ```

    **4. Создание назначения**

    Создайте назначение, чтобы связать сотрудника со штатной единицей:

    ```bash
    curl --request PUT 'https://api.friend.work/Api/Company/Assignments' \
      --header 'Authorization: Bearer {apiToken}' \
      --header 'Content-Type: application/json' \
      --data '{
        "assignments": [
          {
            "timestamp": 1767225600000,
            "foreignKey": "assignment-1",
            "employeeForeignKey": "employee-1",
            "staffPositionForeignKey": "position-2",
            "startedAt": "2026-01-01T00:00:00",
            "state": 0
          }
        ]
      }'
    ```

    После каждого запроса проверьте, что HTTP-запрос выполнен успешно и в теле ответа возвращён
    `code=0`:

    ```json
    {
      "code": 0,
      "message": null
    }
    ```

    **Регулярное обновление**

    После первичной загрузки передавайте только объекты, изменившиеся в системе-источнике с момента
    последней успешно завершённой синхронизации. Несколько изменений объектов одного типа можно
    объединить в один запрос.

    Периодичность отправки выбирается исходя из необходимой актуальности данных:

    - если изменения должны быстро появляться во FriendWork, отправляйте их через небольшие интервалы;
    - если ежедневной актуализации достаточно, накапливайте изменения и передавайте их раз в сутки.

    В обоих случаях запросы выполняются в режиме немедленного обновления без `batchInfo`.
    Не рекомендуется ежедневно передавать полную организационную структуру, если достаточно
    отправить только изменившиеся объекты.

    Указывайте актуальное значение `timestamp` из системы-источника. Оно позволяет API отличать
    новые данные от ранее полученных изменений.

    Например, в одном запросе можно изменить название существующей штатной единицы и добавить новую:

    ```bash
    curl --request PUT 'https://api.friend.work/Api/Company/StaffPositions' \
      --header 'Authorization: Bearer {apiToken}' \
      --header 'Content-Type: application/json' \
      --data '{
        "staffPositions": [
          {
            "timestamp": 1767312000000,
            "foreignKey": "position-2",
            "organizationUnitForeignKey": "department-1",
            "name": "Ведущий разработчик",
            "state": 0
          },
          {
            "timestamp": 1767312000000,
            "foreignKey": "position-3",
            "organizationUnitForeignKey": "department-1",
            "name": "Системный аналитик",
            "createdAt": "2026-01-02T00:00:00",
            "state": 0
          }
        ]
      }'
    ```

    Такой запрос можно отправить сразу после накопления изменений либо по расписанию, например
    раз в сутки. В обоих случаях `batchInfo` передавать не нужно.

    **Архивирование объектов**

    Отсутствие объекта в очередном запросе не приводит к его автоматическому архивированию.

    Для архивирования организационных единиц используйте
    `PUT /Api/Company/OrganizationUnits/State`, а для штатных единиц —
    `PUT /Api/Company/StaffPositions/State`.

    Изменение состояния сотрудников и назначений передавайте при их обновлении через
    `PUT /Api/Company/Employees` и `PUT /Api/Company/Assignments`.

    Например, чтобы архивировать отдел, передайте `state=1`:

    ```bash
    curl --request PUT 'https://api.friend.work/Api/Company/OrganizationUnits/State' \
      --header 'Authorization: Bearer {apiToken}' \
      --header 'Content-Type: application/json' \
      --data '{
        "organizationUnits": [
          {
            "timestamp": 1767398400000,
            "foreignKey": "department-1",
            "state": 1
          }
        ]
      }'
    ```

    Для штатных единиц аналогичный запрос отправляется на
    `PUT /Api/Company/StaffPositions/State`.

    **Обработка результата**

    Считайте запрос успешно обработанным только после получения успешного HTTP-ответа и
    `code=0` в теле ответа. До этого не изменяйте отметку последней успешной синхронизации
    в системе-источнике.

    При получении `429 Too Many Requests` повторите запрос с задержкой. Учитывайте ограничение
    в 2 запроса в секунду и максимальный размер запроса 4 МБ.

    # Часто задаваемые вопросы (FAQ)

    ## Доступ и авторизация

    1. Какой адрес использовать для запросов?

       > Ответ: Все запросы отправляются на базовый URL `https://api.friend.work/`. Путь конкретного
       > метода добавляется к этому адресу.

    2. Почему API возвращает `401 Unauthorized`?

       > Ответ: Проверьте наличие заголовка `Authorization`, схему `Bearer` и корректность
       > API-токена. Ошибка также возвращается, если токен истёк или был отозван.

    3. Почему API возвращает `403 Forbidden`, хотя токен действителен?

       > Ответ: API-токен использует права пользователя, для которого он выпущен. У пользователя
       > может отсутствовать доступ к операции, объекту или функции FriendWork Recruiter.

    4. Можно ли передавать API-токен в URL или теле запроса?

       > Ответ: Нет. Передавайте токен только в заголовке `Authorization: Bearer {apiToken}`.

    ## Запросы и ответы

    1. Где посмотреть обязательные поля запроса?

       > Ответ: Обязательные поля, их типы и допустимые значения указаны в схеме конкретного метода.
       > Примеры могут содержать не все доступные поля.

    2. Чем отличается отсутствующее поле от `null`?

       > Ответ: Эти варианты могут обрабатываться по-разному, особенно при изменении объектов.
       > Используйте вариант, указанный в схеме и описании метода.

    3. Могут ли в ответе появиться новые поля?

       > Ответ: Да, добавление новых полей считается обратно совместимым изменением. Интеграция
       > должна игнорировать неизвестные поля.

    4. Как получать изменения без постоянного опроса API?

       > Ответ: Для поддерживаемых событий можно использовать вебхуки. Доступные события и параметры
       > приведены в разделе «Вебхуки».

    ## Ошибки и повторные запросы

    1. Что делать, если запрос завершился по таймауту?

       > Ответ: Отсутствие ответа не означает, что операция не выполнена. Сервер мог обработать
       > запрос до разрыва соединения. Повтор изменяющего запроса может повторно выполнить операцию
       > или создать дубликат.

    2. Какие запросы можно повторять автоматически?

       > Ответ: Повтор может быть оправдан при временном сетевом сбое, ответе `429` или временной
       > ошибке `5xx`. Не повторяйте автоматически запросы после `400`, `401`, `403`, `404` или `409`.

    3. Почему API возвращает `429 Too Many Requests`?

       > Ответ: Превышено ограничение для API-токена: 2 запроса в секунду или 120 запросов в минуту.
       > Запросы всех экземпляров интеграции с одним токеном учитываются вместе.

    ## Версии и поддержка

    1. Какие данные передать службе поддержки?

       > Ответ: Укажите HTTP-метод, URL, статус ответа, дату и время запроса и значение `X-Trace-Id`,
       > если оно присутствует. Не передавайте API-токен.
  x-logo:
    url: /publicapi/openapi/assets/friendwork-logo.svg
    altText: FriendWork
servers:
  - url: https://api.friend.work
    description: Боевой API
security:
  - BearerAuth: []
tags:
  - name: Аккаунты
    description: |
      Аккаунт представляет пользователя FriendWork в рамках компании. Он содержит данные для входа,
      имя, контактную информацию и персональные настройки, а также может быть связан с ролью,
      заказчиком и подразделением организационной структуры.

      Роль определяет доступные пользователю возможности, а состояние блокировки — возможность
      работать в системе. Методы раздела позволяют получать аккаунты компании, создавать и
      редактировать их, а также блокировать и восстанавливать доступ.
  - name: Роли
    description: |
      Роль определяет набор прав пользователя во FriendWork: доступные ему разделы, данные и действия.
      Роли назначаются аккаунтам и позволяют разграничить возможности пользователей в соответствии
      с их задачами и обязанностями в компании.
  - name: Вакансии
    description: |
      Вакансия — основной объект, в рамках которого организуется подбор кандидатов. Она содержит
      название и описание позиции, текущее состояние подбора, даты работы над вакансией, количество
      позиций, ответственного рекрутера и других участников команды.

      Вакансию можно связать с подразделением и штатными единицами организационной структуры.
      Дополнительные данные, зависящие от процессов вашей компании, можно хранить в настраиваемых
      полях вакансии.

      API возвращает только вакансии, доступные пользователю, для которого выпущен API-токен.
      Возможность создавать, изменять и удалять вакансии также определяется правами этого пользователя.

      Для полной синхронизации состояния вакансии используйте `PUT`, а для изменения отдельных
      полей — `PATCH`.
  - name: Позиции
  - name: Отказы
    description: |
      Отказ фиксирует решение не продолжать рассмотрение кандидата по конкретной вакансии.
      В разделе можно указать причину и комментарий, изменить или отменить ранее созданный отказ,
      а также получить список отказов кандидата.

      Причина отказа должна быть заранее создана во FriendWork и находиться в активном состоянии.
      Передавайте её `id` или `name`: новая причина по переданному названию не создаётся.
      Для устойчивой интеграции рекомендуется использовать `id`, поскольку название может измениться.
  - name: Вебхуки
    description: |
      Вебхуки позволяют получать уведомления о событиях FriendWork Recruiter.
      При наступлении события система отправляет email, HTTP- или HTTPS-запрос
      с данными события.

      ## Поддерживаемые события

      - Создание, редактирование и удаление записей в ленте кандидата: статусов
        и комментариев.
      - Создание, редактирование и удаление карточки кандидата.
      - Объединение кандидатов.
      - Создание, обновление и удаление вакансий.

      ## Доставка и повторные попытки

      При ошибке доставки выполняется до 3 попыток с интервалом 20 секунд.
      Обработчик должен быть идемпотентным: один и тот же payload может прийти
      повторно.

      ## Настройка вебхука

      В настройке вебхука задаются:

      - `type` — способ доставки;
      - `rule` — правило срабатывания;
      - `dataItems` — дополнительные блоки данных, которые нужно включить в payload.

      ### HTTP-доставка

      Для HTTP-доставки используйте `type: 1`.

      - Поле `authorization` задаёт значение заголовка `Authorization`, которое
        FriendWork передаст вашему обработчику. Не путайте его с API-токеном:
        `Authorization: Bearer {apiToken}` используется для авторизации запросов
        интеграции к FriendWork API.
      - Укажите корректный `url`. API создания не всегда проверяет его наличие
        и формат.
      - Поле `method` необязательно. Если оно не передано, используется
        `0` (`GET`).
      - Для отправки POST-запроса явно передайте `method: 1`.
      - HTTP-вебхук нельзя ограничить одной вакансией через `jobId`. Если это
        нужно, фильтруйте события у получателя по `candidateHistory.jobId`.

      ### Email-доставка

      Для email-доставки доступны `SendEmail` (`type: 2`) и `SendEmailTemplate`
      (`type: 3`).

      - `GET /webhooks` не возвращает поле `email`, хотя `POST` принимает и
        сохраняет его для email-доставки.
      - Поле `jobId` фильтрует только `SendEmailTemplate` (`type: 3`). Для
        HTTP (`type: 1`) и `SendEmail` (`type: 2`) оно игнорируется.

      ### Проверка конфигурации

      Перед созданием проверяйте обязательные поля и совместимость `type`, `rule`
      и фильтров. Часть неполных или несовместимых конфигураций может сохраниться,
      но не доставлять события.

      - Неизвестные значения `dataItems` отклоняются с `400 Bad Request`.
      - Если дополнительные блоки не нужны, не передавайте поле `dataItems` или
        передайте `dataItems: []`.
      - Не передавайте `dataItems: null`.

      ### Опциональные блоки данных

      `dataItems` — массив строк, который определяет, какие дополнительные блоки
      данных включить в payload.

      Значения `dataItems` чувствительны к регистру. Неприменимое к событию значение
      может быть сохранено, но соответствующий блок не будет включён в payload.
      Поле используется только для HTTP-доставки и игнорируется при отправке email.

      | Значение | Описание | Применяется для |
      | --- | --- | --- |
      | `webhook.name` | Название вебхука | Все события с HTTP-доставкой |
      | `candidateHistory.creator` | ФИО и логин создателя записи | События ленты кандидата |
      | `candidateHistory.responsible` | ФИО и логин ответственного | События ленты кандидата |
      | `job.organizationUnit` | Подразделение вакансии | События ленты, связанные с вакансией |
      | `job.organizationUnit.customFields` | Настраиваемые поля подразделения | События ленты, связанные с вакансией |
      | `candidateDisqualification` | Данные отказа | События ленты, связанные с отказом |
      | `candidate.histories` | Все открытые записи ленты кандидата | События ленты, карточки кандидата и объединения кандидатов |
      | `candidate.activeStatuses` | Все активные статусы кандидата по вакансиям | События ленты, карточки кандидата и объединения кандидатов |
      | `job` | Данные вакансии | События вакансий |
      | `event` | Описание фактической операции и типа сущности; не является значением поля `rule` | Все события с HTTP-доставкой |

      `additionalData` влияет только на события ленты, карточки кандидата и объединения
      кандидатов. Для событий вакансий и email-доставки это поле игнорируется.

      ### Ограничения по событиям

      Правила `OnCandidateCreated`, `OnCandidateUpdated`, `OnCandidateDeleted`,
      `OnCandidateMerged`, `OnJobCreated`, `OnJobUpdated` и `OnJobDeleted`
      поддерживаются только для HTTP-доставки (`type: 1`).

      Email-доставка (`type: 2` и `type: 3`) имеет ограниченный набор событий:
      письмо отправляется только для записи ленты со статусом на вакансии при
      заданном `candidateStatusId`. Комментарии, события карточки кандидата,
      объединение кандидатов и события вакансий по email не доставляются.
      Для новых интеграций рекомендуется HTTP-доставка.

      `OnHistoryDeleted` означает удаление записи `CandidateHistory` из ленты
      кандидата — статуса или комментария. Удаление письма, сообщения Telegram
      или другой коммуникации это событие не создает.

      Если событие не сформировало ни одного блока данных, HTTP-запрос не
      отправляется. Для событий карточки кандидата и объединения настройте
      `additionalData: 1` и/или применимые `dataItems`. Для событий вакансии
      добавьте `job` и/или `event` в `dataItems`.

      ### Формат отправки payload

      - При `method: 1` payload отправляется JSON-телом `POST`-запроса.
      - При `method: 0` тот же JSON URL-кодируется и добавляется к query string
        как сырой компонент без имени параметра, например без `payload=`.
      - Поля со значением `null` в исходящем JSON не передаются.

      ## Правила для ленты кандидата

      Правила `None` (`0`), `OnlyOnAdd` (`1`), `FireOnAnyStatus` (`2`) и
      `OnHistoryDeleted` (`5`) относятся к записям в ленте кандидата.

      `None` — историческое название. Значение `rule: 0` не отключает вебхук,
      а ограничивает его событиями указанного `candidateStatusId`.

      - `None` срабатывает при создании и редактировании записи, если текущий
        `candidateStatusId` совпадает с настройкой вебхука. При смене подстатуса
        вебхук сработает только если настроен на новый `candidateStatusId`.
        Не срабатывает на комментарии, то есть записи без статуса.
      - `OnlyOnAdd` работает как `None`, но только при создании. Не срабатывает
        при смене подстатуса, потому что это считается редактированием.
        Не срабатывает на комментарии.
      - `FireOnAnyStatus` срабатывает при любом создании или редактировании записи
        без проверки статуса. Срабатывает и на статусы, и на комментарии.
      - `OnHistoryDeleted` срабатывает только при удалении. Остальные правила
        при удалении не срабатывают. Срабатывает и на статусы, и на комментарии.

      Смена подстатуса, например `Интервью` -> `Интервью состоялось`, считается
      редактированием: `OnlyOnAdd` не срабатывает, `None` проверяет новый
      `candidateStatusId`, а `FireOnAnyStatus` срабатывает независимо от статуса.
      Перевод на другой этап воронки, например `Интервью` -> `Оффер`, создает
      новую запись: для нового статуса могут сработать `None`, `OnlyOnAdd` и
      `FireOnAnyStatus`.

      Правила `OnHistoryDeleted`, `OnCandidateMerged`, `OnCandidateCreated`,
      `OnCandidateUpdated`, `OnCandidateDeleted` и `OnJobDeleted` применяются,
      только если соответствующее значение явно указано в поле `rule` при создании
      вебхука. Вебхуки с другими значениями `rule` не начинают обрабатывать эти
      события автоматически.

      ## Какие вебхуки срабатывают при создании кандидата

      Ниже перечислены значения поля `rule`, для которых фактически вызывается вебхук.
      Само появление записи в системе ещё не означает отправку: в некоторых
      сценариях вебхук формируется только для части созданных записей.

      Не путайте `rule` с полем `event.action`: `rule` определяет, когда
      срабатывает настроенный вебхук, а `event.action` только описывает
      фактическую операцию в исходящем payload.

      ### Обычное создание новой карточки

      1. Создаётся статус `Новый` без вакансии — срабатывает `FireOnAnyStatus`,
         а также `None` и `OnlyOnAdd`, если `candidateStatusId` вебхука настроен
         на статус `Новый`.
      2. Создаётся карточка кандидата — срабатывает `OnCandidateCreated`.

      ### Создание с выбранной вакансией и статусом

      1. Создаётся статус `Новый` без вакансии — срабатывает `FireOnAnyStatus`,
         а также `None` и `OnlyOnAdd`, настроенные на статус `Новый`.
      2. Создаётся выбранный статус на вакансии — срабатывает `FireOnAnyStatus`,
         а также `None` и `OnlyOnAdd`, настроенные на выбранный статус.
      3. Для действительно новой активной карточки срабатывает `OnCandidateCreated`.
         Если пользователь завершает создание ранее импортированной карточки,
         например после импорта через расширение браузера, система обрабатывает
         карточку как обновление и срабатывает `OnCandidateUpdated`.

      ### Создание из отклика

      При создании кандидата из отклика не каждое сохранение записи сопровождается
      вебхуком:

      - карточка кандидата создаётся как импортированная, поэтому
        `OnCandidateCreated` и `OnCandidateUpdated` не срабатывают;
      - статус `Новый` без вакансии сохраняется, но отдельный вебхук для этой
        записи не запускается;
      - статус на конкретной вакансии сохраняется; вебхук для него отправляется
        после обработки возможных дубликатов;
      - если отклик объединяется с уже существующим кандидатом, сначала
        срабатывает `OnCandidateMerged`;
      - затем для статуса на конкретной вакансии срабатывает `FireOnAnyStatus`,
        а также `None` и `OnlyOnAdd`, настроенные на этот статус.

      `OnCandidateCreated` и `OnCandidateUpdated` относятся к карточке кандидата,
      а не к истории статусов. `OnCandidateUpdated` покрывает поддерживаемые
      сценарии изменения карточки и не является полным аудит-логом всех импортов
      и фоновых изменений.

      `OnCandidateUpdated` не гарантирует уведомление о каждом низкоуровневом
      изменении: некоторые импорты и фоновые операции могут сохранить данные
      без вебхука. Аналогично `OnJobUpdated` запускается полным сценарием
      обновления вакансии, а не любым низкоуровневым сохранением её данных.

      ## Какие вебхуки срабатывают при изменении ленты кандидата

      В этом разделе также перечислены значения поля `rule`. Поля блока `event` для
      соответствующих операций описаны отдельно в разделе `Блок event`.

      ### Статусы

      - Изменение описания, дат, рейтинга, ответственного или вакансии обновляет
        существующую запись. Срабатывает `FireOnAnyStatus`, а также `None`, если
        он настроен на текущий `candidateStatusId`; `OnlyOnAdd` не срабатывает.
      - Смена родительского статуса на связанный подстатус или обратно считается
        редактированием. Срабатывает `FireOnAnyStatus`, а также `None`,
        настроенный на новый `candidateStatusId`; `OnlyOnAdd` не срабатывает.
      - Переход на другой этап воронки создает новую запись статуса. Срабатывает
        `FireOnAnyStatus`, а также `None` и `OnlyOnAdd`, настроенные на новый
        статус.
      - Удаление статуса вызывает только `OnHistoryDeleted`.
      - Комментарий нельзя превратить в статус, поэтому такое действие не вызывает
        вебхук.

      ### Комментарии

      - Создание или редактирование комментария, включая повышение приватности,
        вызывает `FireOnAnyStatus`. `None` и `OnlyOnAdd` комментарии игнорируют.
      - Удаление комментария вызывает только `OnHistoryDeleted`.
      - Скрытый комментарий нельзя сделать обычным, поэтому такое действие не
        вызывает вебхук.
      - Комментарии от стороннего job board не редактируются, поэтому при попытке
        такого изменения вебхук не возникает.

      ## Формат исходящего payload

      Набор верхнеуровневых блоков зависит от события, `additionalData` и
      `dataItems`. Ключи с точками, например `candidate.activeStatuses`,
      являются буквальными именами JSON-полей.

      Ниже приведён общий перечень возможных блоков, а не пример payload одного события.
      Фактический состав зависит от события и настроек вебхука:

      ```json
      {
        "candidateHistory": {},
        "candidate": {},
        "webhook": { "name": "..." },
        "candidateHistory.creator": {},
        "candidateHistory.responsible": {},
        "job.organizationUnit": {},
        "job.organizationUnit.customFields": [],
        "candidateDisqualification": {},
        "candidate.histories": [],
        "candidate.activeStatuses": [],
        "job": {},
        "event": {}
      }
      ```

      - `candidateHistory` автоматически формируется для событий ленты: создания,
        редактирования и удаления статуса или комментария.
      - `candidate` включается при `additionalData: 1`. Для событий карточки
        кандидата и объединения кандидатов это основной способ получить данные кандидата.
      - `webhook`, данные автора/ответственного, подразделение, отказ, открытые
        записи ленты, активные статусы, `job` и `event` включаются через
        `dataItems`.
      - `candidate.histories` содержит только открытые записи ленты, а не полный
        архив.
      - Для `job created` и `job updated` блок `job` соответствует представлению
        вакансии в API и содержит `jobId` и строковый `status`. Для
        `job deleted` приходит сокращенный снимок с полями `id`, `name`, числовым
        `status` и `clientId`.

      ### Старый однообъектный формат

      Если единственный верхнеуровневый блок — `candidateHistory` или `candidate`,
      его значение разворачивается в корень JSON. Это прежний формат, сохраненный
      для обратной совместимости. Один `job`, `event`, `webhook` или другой блок
      не разворачивается.

      Настройка примера: `type: 1`, `method: 1`, `rule: 2`, `additionalData: 0`,
      `dataItems: []`.

      ```json
      {
        "candidateHistoryId": 12345,
        "statusId": 5,
        "jobId": 42,
        "jobName": "Frontend-разработчик",
        "name": "Интервью",
        "fromDate": "15.03.2026 10:00",
        "isAllDay": false,
        "description": "Техническое интервью с тимлидом",
        "accountId": 10,
        "responsibleId": 25,
        "candidateId": 100,
        "additional": []
      }
      ```

      ### Формат с именованными блоками

      Если блоков несколько, каждый остается отдельным верхнеуровневым ключом.
      Добавление `event` к одному `candidateHistory` или `candidate` переключает
      payload на именованные блоки.

      Настройка примера: `type: 1`, `method: 1`, `rule: 2`, `additionalData: 0`,
      `dataItems: ["event"]`.

      ```json
      {
        "candidateHistory": {
          "candidateHistoryId": 12345,
          "statusId": 5,
          "jobId": 42,
          "candidateId": 100
        },
        "event": {
          "action": "created",
          "entity": "candidateHistory",
          "candidateHistory": {
            "entityType": "status",
            "isActive": true
          }
        }
      }
      ```

      ### candidateHistory: статус или комментарий

      У комментария нет `statusId`, а `jobId` приходит как `0`. У статуса `Новый`
      без вакансии тоже `jobId` равен `0`, но `statusId` присутствует. Надежнее
      различать записи по `event.candidateHistory.entityType`: `status` или
      `comment`.

      Для `event.action: created` и `event.action: updated` передается актуальное
      состояние записи; для `deleted` — снимок на момент удаления. При `merged`
      блок `candidateHistory` отсутствует.

      ## Блок event

      `event` включается только если строка `event` указана в `dataItems`.

      `event.action` — поле исходящего payload, а не правило подписки. `rule`
      определяет, когда вебхук срабатывает; `event.action` сообщает получателю,
      какая операция фактически произошла.

      `event.action` принимает `created`, `updated`, `deleted` или `merged`;
      `entity` — `candidateHistory`, `candidate` или `job`.

      Для `candidateHistory` объект `event.candidateHistory` содержит `entityType`
      (`status` или `comment`) и `isActive`.

      Для объединения `event.candidate.mergedCandidateId` содержит ID
      кандидата-дубликата.

      `changes` присутствует только при `updated candidateHistory` и содержит
      прежнее и новое значения `candidateStatusId` и/или `jobId`. Если менялись
      только текст, дата или другие поля, `changes` может быть пустым объектом
      `{}`.

      ```json
      {
        "changes": {
          "candidateStatusId": { "old": 12, "new": 15 },
          "jobId": { "old": 42, "new": 99 }
        }
      }
      ```

  - name: Организационная структура
    description: |
      API предназначен для синхронизации организационной структуры между кадровой системой
      компании и FriendWork Recruiter.

      ## Состав организационной структуры

      В FriendWork организационная структура компании представлена несколькими связанными типами
      объектов. Они описывают иерархию подразделений, штатную структуру, сотрудников и назначения
      сотрудников на штатные единицы.

      1. **Организационные единицы** (`OrganizationUnits`).<br>
         Организационные единицы образуют иерархию компании. К ним относятся юридические лица,
         филиалы, подразделения, департаменты, отделы и другие элементы организационной структуры.<br>
         Связь между дочерней и родительской организационными единицами задаётся через
         `parentForeignKey`. Корневые элементы структуры не имеют родительской единицы и обозначаются
         как юридические лица с помощью `isLegalEntity=true`.<br>
         Организационная единица может содержать штатные единицы. Для неё также можно указать штатную
         единицу линейного руководителя и дополнительные данные в настраиваемых полях.

      2. **Штатные единицы** (`StaffPositions`).<br>
         Штатная единица описывает место в штатной структуре компании, например «Руководитель отдела»,
         «Рекрутер» или «Разработчик». Она существует независимо от конкретного сотрудника и может
         оставаться в структуре, даже если сотрудник на неё ещё не назначен.<br>
         Штатную единицу можно связать с организационной единицей через
         `organizationUnitForeignKey`. Для неё также можно указать штатные единицы линейного,
         функционального и проектного руководителей.<br>
         Сотрудник не указывается непосредственно в штатной единице. Связь сотрудника со штатной
         единицей создаётся отдельным объектом назначения — `Assignment`.

      3. **Сотрудники** (`Employees`).<br>
         Сотрудник представляет физическое лицо, работающее в компании. Объект содержит табельный
         номер, Ф. И. О., дату приёма на работу, контактные данные и другие сведения о сотруднике.<br>
         Сам объект сотрудника не определяет его место в организационной структуре. Чтобы указать,
         на какой штатной единице работает сотрудник, необходимо создать назначение `Assignment`.<br>
         Состояние сотрудника позволяет обозначить, что он активен, уволен или перемещён в архив.
         Дополнительные сведения о сотруднике можно хранить в настраиваемых полях.

      4. **Назначения сотрудников** (`Assignments`).<br>
         Назначение связывает сотрудника (`Employee`) со штатной единицей (`StaffPosition`). Для связи
         используются внешние идентификаторы сотрудника и штатной единицы: `employeeForeignKey` и
         `staffPositionForeignKey`.<br>
         Назначение содержит период действия связи: дату начала и, при необходимости, дату окончания.
         Также в нём можно передать даты испытательного срока и состояние назначения.<br>
         Сотрудник, штатная единица и назначение передаются как отдельные объекты. Такой подход
         позволяет независимо обновлять сведения о сотруднике, штатной структуре и периоде работы
         сотрудника на конкретной штатной единице.

      5. **Настраиваемые поля** (`CustomFields`).<br>
         Настраиваемые поля позволяют передавать дополнительные данные, для которых нет стандартных
         полей в API. Значения настраиваемых полей поддерживаются для следующих типов объектов:

         - организационная единица — `OrganizationUnit`;
         - штатная единица — `StaffPosition`;
         - сотрудник — `Employee`.

         Объект определяется по его `foreignKey`, а настраиваемое поле — по `systemName`. Поле может
         содержать одно значение в `value` или несколько значений в `values`.<br>
         Значения можно обновлять как для одного объекта, так и пакетно для нескольких объектов одного
         типа. Настраиваемые поля дополняют объект, но не создают связи между организационными
         единицами, штатными единицами и сотрудниками.

      В общем виде объекты связаны следующим образом:

      - организационные единицы образуют иерархию компании;
      - штатная единица может относиться к организационной единице;
      - сотрудник связывается со штатной единицей через назначение;
      - настраиваемые поля дополняют организационные единицы, штатные единицы и сотрудников
        специфичными для компании данными.

      ## Общие правила синхронизации

      - Доступные типы объектов определяются тарифом компании.
      - Объекты связываются по `foreignKey` — идентификатору объекта в системе-источнике
        длиной до 36 символов.
      - Связанные объекты можно передавать в произвольном порядке. API допускает ссылки на объекты,
        которые ещё не были переданы. После передачи недостающих объектов связи согласуются
        автоматически. Исключение составляют значения настраиваемых полей и их возможные значения.
      - Размер одного запроса не должен превышать 4 МБ.
      - Загрузку более 50 МБ в сутки в облачной версии необходимо согласовать отдельно,
        иначе возможна автоматическая блокировка аккаунта компании.

      ## Режим API

      Методы API, предназначенные для создания/обновления объектов организационной структуры,
      могут использоваться в двух вариантах: пакетный режим и режим немедленного обновления.

      При использовании **режима немедленного обновления** данные в системе обновляются
      непосредственно после получения запроса.

      > Пакетный режим на данный момент не поддерживается и его корректная работа не гарантируется.<br>
      > В облачной версии использование пакетного режима не планируется.

      При использовании **пакетного режима** производится постепенное накопление данных в
      промежуточном хранилище. Подмножество объектов ОШС, полученных в рамках одного вызова API
      называется *пакетом*. Совокупность пакетов называется *трансфером*. Все пакеты, входящие в
      трансфер, должны содержать одинаковый идентификатор трансфера в специально предназначенном
      для этого реквизите (поле объекта запроса).

      Трансфер может содержать объекты только одного типа (подразделение, сотрудник, штатная
      должность, либо связь сотрудника и должности).

      После получения последнего пакета трансфера выполняется загрузка накопленных данных в систему
      в пределах суточного расписания, заданного в настройках приложения (не настраивается для
      клиентов облачной версии — для всех одинаковое). Если хотя бы один пакет из трансфера не
      получен системой, то все данные трансфера загружены не будут.

      После записи данных трансфера в систему выполняется **автоматическая архивация** (то есть
      вывод из состава ОШС) сущностей, которые присутствуют в системе, но не вошли в только что
      загруженный трансфер.

      Необходимость выполнения автоархивации на стороне системы FriendWork является единственной
      возможной причиной, обусловливающей использование пакетного режима. Если учётная система
      предприятия (источник данных ОШС) может на своей стороне отслеживать вывод сущностей из ОШС и
      передавать эту информацию во FriendWork (с помощью соответствующих методов API), то
      рекомендуется использовать режим немедленного обновления.

      Для того, чтобы данные ОШС были обработаны в пакетном режиме, запрос должен содержать в своем
      составе непустой объект *BatchInfo*. Если объект *BatchInfo* отсутствует, то будет выполнено
      немедленное обновление данных. Если какие-либо реквизиты объект *BatchInfo* отсутствуют либо
      пусты, то загрузка выполнена не будет.

      ```
      {
        "batchInfo": {
          "transferId": "22c85210-43ee-4ea7-aee3-de3f0a7c6dba",
          "totalCount": 3,
          "currentNumber": 1
        },
        ...
      }
      ```

      | Поле | Тип | Описание |
      |---|---|---|
      | batchInfo | object | Опционально.<br>Информация о переданном пакете данных. |
      | batchInfo.transferId | string | Идентификатор серии пакетов данных.<br>Т.е. если в серии запросов имеется три пакета данных, то у каждого из них должен быть одинаковый уникальный идентификатор.<br>Максимальная длина — 36 символов. |
      | batchInfo.totalCount | number | Общее количество пакетов в серии запросов.<br>Не может быть более чем 200. |
      | batchInfo.currentNumber | number | Текущий номер пакета.<br>Если в серии имеется 3 пакета, то у каждого пакета должны быть уникальные номера, которые начинают отсчет от единицы до последнего номера, который соответствует количеству пакетов (в случае передачи 3 пакетов, номера будут следующие: 1, 2, 3). |

      Тело ответа при использовании пакетного режима, помимо стандартных полей (см.
      [Формат ответа](https://docs.google.com/document/d/1GP1BiTkb6-UC1o_ibWHVp23NfBVjZkJuq1FKR1ksP64/edit#heading=h.ty1kz3jlgaj6)),
      будет содержать также информацию о статусе трансфера:

      ```
      {
        "Body": {
          "TransferId": "22c85210-43ee-4ea7-aee3-de3f0a7c6dba",
          "BatchesTotalCount": 2,
          "Status": 0,
          "ReceivedBatchNumbers": [
            1
          ]
        },
        //…
      }
      ```

      | Поле | Тип | Описание |
      |---|---|---|
      | TransferId | string | Идентификатор трансфера. |
      | BatchesTotalCount | number | Количество пакетов в трансфере |
      | Status | number | Статус трансфера по результатам получения пакета:<br>0 — ожидание следующего пакета<br>1 — все пакеты получены |
      | ReceivedBatchNumbers | array | Коллекция номеров полученных пакетов трансфера |

      ## Ограничения

      *Замечание*. На пути снизу вверх по каждой из ветвей организационной структуры не может быть
      более одного объекта организационной структуры, помеченного как юридическое лицо
      (isLegalEntity = true).

      *Возможная доработка*. При получении оргструктуры для каждого корневого элемента у которого не
      выставлен isLegalEntity = true, система автоматически проставляет isLegalEntity = true. При
      этом соблюдение предыдущего замечания не проверяется и находится на стороне заказчика.

      *Замечание.* С каждым сотрудником (Employee) не может быть связано несколько штатных должностей
      (StaffPosition через связь Assignments) с разными юридическими лицами (isLegalEntitty = true) в
      родителях.

      *Замечание.* Если есть необходимость, чтобы пользователь мог работать как сотрудник,
      находящийся на разных штатных должностях, то для каждой должности должен быть создан отдельный
      аккаунт (вручную или в рамках AD).

      *Замечание.* Видимость данных у аккаунта не зависит от положения сотрудника в оргструктуре.

      *Замечание.* С каждым сотрудником (Employees) должно быть связано не более одной активной
      штатной должности (StaffPositions).

      Для API установлено ограничение, которое не позволяет обслуживать более 2 запросов в секунду.
      Для последующих запросов в рамках одной секунды — ответ будет содержать код ответа — 429 Too
      many Requests.
  - name: Настраиваемые поля
paths:
  /api/v2/accounts:
    get:
      tags:
        - Аккаунты
      summary: Получение списка аккаунтов
      operationId: getAccountsV2
      description: |
        Возвращает постраничный список аккаунтов текущей компании. Метод доступен только
        администратору.

        Список можно:

        - отфильтровать по состоянию блокировки и роли;
        - найти аккаунты по части логина, имени или фамилии без учёта регистра;
        - отсортировать по идентификатору, логину или дате создания.

        По умолчанию возвращаются активные и заблокированные аккаунты, отсортированные по
        идентификатору по возрастанию.

        Параметры пагинации и сортировки объединены в группы `paging` и `sort`. Например:

        ```http
        GET /api/v2/accounts?paging.page=2&paging.perPage=100&sort.sortBy=UserName&sort.sortOrder=Asc
        ```
      parameters:
        - name: isBlocked
          in: query
          required: false
          description: |
            Фильтр по состоянию аккаунта. `true` возвращает только заблокированные аккаунты,
            `false` — только активные. Если параметр не передан, возвращаются оба состояния.
          schema:
            type: boolean
        - name: roleId
          in: query
          required: false
          description: |
            Идентификатор роли текущей компании. Если роль не существует, API возвращает
            `400 Bad Request`.
          schema:
            type: integer
            format: int32
            minimum: 1
          example: 12
        - name: search
          in: query
          required: false
          description: Поисковая строка для логина, имени и фамилии.
          schema:
            type: string
          example: иван
        - name: sort.sortBy
          in: query
          required: false
          description: |
            Поле сортировки. Имена принимаются без учёта регистра.

            Для `UserName` используется регистронезависимая сортировка. Для `UserName` и
            `CreatedAt` дополнительной сортировкой служит `accountId` в том же направлении,
            чтобы порядок страниц был стабильным.

            Поле можно указать названием (`AccountId`, `UserName`, `CreatedAt`) или соответствующим
            числом (`0`, `1`, `2`).
          schema:
            default: AccountId
            oneOf:
              - type: string
                enum:
                  - AccountId
                  - UserName
                  - CreatedAt
              - type: integer
                format: int32
                deprecated: true
                enum:
                  - 0
                  - 1
                  - 2
        - name: sort.sortOrder
          in: query
          required: false
          description: |
            Направление сортировки. Имена принимаются без учёта регистра.

            Направление можно указать названием (`Asc`, `Desc`) или соответствующим числом
            (`0`, `1`).
          schema:
            default: Asc
            oneOf:
              - type: string
                enum:
                  - Asc
                  - Desc
              - type: integer
                format: int32
                deprecated: true
                enum:
                  - 0
                  - 1
        - name: paging.page
          in: query
          required: false
          description: Номер страницы, начиная с единицы.
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: paging.perPage
          in: query
          required: false
          description: Количество аккаунтов на странице.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 20
      responses:
        '200':
          description: Страница аккаунтов получена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsPageResponse'
        '400':
          $ref: '#/components/responses/PublicApiValidationError'
        '401':
          $ref: '#/components/responses/PublicApiUnauthorized'
        '403':
          $ref: '#/components/responses/PublicApiForbidden'
        '429':
          $ref: '#/components/responses/PublicApiTooManyRequests'
        '500':
          $ref: '#/components/responses/PublicApiInternalServerError'
    post:
      tags:
        - Аккаунты
      summary: Создание аккаунта
      operationId: createAccountV2
      description: |
        Создает новый активный аккаунт в текущей компании. Метод доступен только администратору.

        Для создания аккаунта:

        - укажите email пользователя в `userName`;
        - заполните имя или фамилию;
        - при необходимости укажите телефон, роль и заказчика;
        - передайте пароль либо позвольте системе сгенерировать его автоматически;
        - включите `sendWelcomeEmail`, если пользователю нужно отправить приветственное письмо.

        Пароль не возвращается в ответе. Если аккаунт нельзя создать из-за конфликта логина или
        ограничения количества аккаунтов, API возвращает `409 Conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountPublicApiRequest'
            example:
              userName: anna.ivanova@example.com
              firstName: Анна
              lastName: Иванова
              phone: '+79990000000'
              password: StrongPass1!
              roleId: 12
              customerId: 34
              sendWelcomeEmail: true
      responses:
        '201':
          description: Аккаунт создан.
          headers:
            Location:
              description: Относительный URL созданного аккаунта.
              schema:
                type: string
              example: /api/v2/accounts/123
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPublicApiResponse'
        '400':
          $ref: '#/components/responses/PublicApiCreateAccountBadRequest'
        '401':
          $ref: '#/components/responses/PublicApiUnauthorized'
        '403':
          $ref: '#/components/responses/PublicApiForbidden'
        '409':
          $ref: '#/components/responses/PublicApiConflict'
        '429':
          $ref: '#/components/responses/PublicApiTooManyRequests'
        '500':
          $ref: '#/components/responses/PublicApiInternalServerError'
  /api/v2/accounts/{accountId}:
    get:
      tags:
        - Аккаунты
      summary: Получение аккаунта
      operationId: getAccountByIdV2
      description: |
        Возвращает подробную информацию об аккаунте компании по его идентификатору. В ответе
        доступны данные пользователя, состояние блокировки, назначенная роль, заказчик,
        подразделение и персональные настройки.

        Метод доступен только администратору.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Аккаунт получен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPublicApiResponse'
        '400':
          $ref: '#/components/responses/PublicApiValidationError'
        '401':
          $ref: '#/components/responses/PublicApiUnauthorized'
        '403':
          $ref: '#/components/responses/PublicApiForbidden'
        '404':
          $ref: '#/components/responses/PublicApiNotFound'
        '429':
          $ref: '#/components/responses/PublicApiTooManyRequests'
        '500':
          $ref: '#/components/responses/PublicApiInternalServerError'
    patch:
      tags:
        - Аккаунты
      summary: Частичное изменение аккаунта
      operationId: patchAccountV2
      description: |
        Изменяет отдельные данные аккаунта и возвращает его актуальное состояние. Метод доступен
        только администратору.

        Можно изменить:

        - логин;
        - имя, фамилию и телефон;
        - назначенную роль;
        - заказчика.

        Тело запроса передается в формате JSON Patch:

        - `replace` устанавливает новое значение;
        - `remove` удаляет значение необязательного поля.

        ```json
        [
          {
            "op": "replace",
            "path": "/firstName",
            "value": "Анна"
          },
          {
            "op": "remove",
            "path": "/customerId"
          }
        ]
        ```

        Логин можно изменить только операцией `replace`. Если изменение вызывает конфликт логина
        или ограничений аккаунтов, API возвращает `409 Conflict`.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PatchAccountPublicApiRequest'
            example:
              - op: replace
                path: /firstName
                value: Анна
              - op: replace
                path: /roleId
                value: 12
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAccountPublicApiRequest'
      responses:
        '200':
          description: Аккаунт изменен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPublicApiResponse'
        '400':
          $ref: '#/components/responses/PublicApiValidationError'
        '401':
          $ref: '#/components/responses/PublicApiUnauthorized'
        '403':
          $ref: '#/components/responses/PublicApiForbidden'
        '404':
          $ref: '#/components/responses/PublicApiNotFound'
        '409':
          $ref: '#/components/responses/PublicApiConflict'
        '429':
          $ref: '#/components/responses/PublicApiTooManyRequests'
        '500':
          $ref: '#/components/responses/PublicApiInternalServerError'
  /api/v2/accounts/{accountId}/block:
    post:
      tags:
        - Аккаунты
      summary: Блокировка аккаунта
      operationId: blockAccountV2
      description: |
        Блокирует аккаунт и закрывает пользователю доступ к FriendWork. В ответе возвращается
        актуальная информация об аккаунте.

        Метод доступен только администратору. Собственный аккаунт заблокировать нельзя. Повторный
        запрос для уже заблокированного аккаунта завершится успешно.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Аккаунт заблокирован или уже был заблокирован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPublicApiResponse'
        '400':
          $ref: '#/components/responses/PublicApiValidationError'
        '401':
          $ref: '#/components/responses/PublicApiUnauthorized'
        '403':
          $ref: '#/components/responses/PublicApiForbidden'
        '404':
          $ref: '#/components/responses/PublicApiNotFound'
        '429':
          $ref: '#/components/responses/PublicApiTooManyRequests'
        '500':
          $ref: '#/components/responses/PublicApiInternalServerError'
  /api/v2/accounts/{accountId}/restore:
    post:
      tags:
        - Аккаунты
      summary: Восстановление аккаунта
      operationId: restoreAccountV2
      description: |
        Восстанавливает аккаунт и возвращает пользователю доступ к FriendWork. В ответе возвращается
        актуальная информация об аккаунте.

        Метод доступен только администратору. Собственный аккаунт восстановить нельзя. Повторный
        запрос для уже активного аккаунта завершится успешно. Восстановление возможно, если не
        превышен лимит активных аккаунтов.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Аккаунт восстановлен или уже был активен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPublicApiResponse'
        '400':
          $ref: '#/components/responses/PublicApiValidationError'
        '401':
          $ref: '#/components/responses/PublicApiUnauthorized'
        '403':
          $ref: '#/components/responses/PublicApiForbidden'
        '404':
          $ref: '#/components/responses/PublicApiNotFound'
        '409':
          $ref: '#/components/responses/PublicApiConflict'
        '429':
          $ref: '#/components/responses/PublicApiTooManyRequests'
        '500':
          $ref: '#/components/responses/PublicApiInternalServerError'
