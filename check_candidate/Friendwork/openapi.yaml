              nullable: true
              enum:
                - null
          description: |
            Состояние организационной единицы:

            - `0` — Активный;
            - `1` — Архивный.

            Если поле отсутствует, используется состояние `0` — Активный.
        isLegalEntity:
          type: boolean
          nullable: true
          description: |
