          description: |
            Связанное подразделение. Передайте `id` подразделения в FriendWork или `foreignKey`
            подразделения в системе клиента.

            Если подразделение не нужно связывать с вакансией, передайте `null` или не передавайте поле.
          type: object
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/OrganizationStructureItemIdentifierRequest'
