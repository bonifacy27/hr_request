      description: |
        Удаляет вакансию по идентификатору.

        При успешном удалении API возвращает `200 OK` без тела ответа.
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '200':
          description: Вакансия удалена, тело ответа пустое.
        '400':
