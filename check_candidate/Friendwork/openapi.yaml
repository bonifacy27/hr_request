                  id: 3812
                  userName: vd@friendwork.ru
                  firstName: Vladyslav
                  lastName: Dudarev
                responsibleAccount:
                  id: 3820
                  userName: aff@friendwork.ru
                  firstName: Artem
                  lastName: Fedor
                employeeAccounts: []
                teamMembers: []
                allowedCandidateStatusIds: null
                suspensePeriods:
