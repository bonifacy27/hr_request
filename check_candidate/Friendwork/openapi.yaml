                  id: 1001
                  name: Розница
                  foreignKey: 947d1c55-741f-4780-84f1-2410e563c488
                staffPositions:
                  - id: 2001
                    name: Кассир
                    foreignKey: 01881432-12a2-40cf-925b-509beac3694c
        '400':
          description: Некорректный формат запроса или попытка обратиться к несуществующей вакансии.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenViewJobs'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Вакансии
      summary: Изменение всех полей вакансии
      operationId: updateJob
      description: |
        Полностью обновляет данные вакансии.

        Передавайте полное целевое состояние вакансии в той же структуре, что используется
        при создании. При успешном изменении API возвращает `200 OK` без тела ответа.

        Если передаются `staffPositions`, необходимо также передать `organizationUnit`.
        Все штатные единицы должны относиться к указанному подразделению.

        Смена `organizationUnit` не затрагивает позиции вакансии. Если у позиции указана
        штатная единица прежнего подразделения, связь сохраняется, запрос выполняется успешно
        и возвращает `200 OK`. Интерфейс в этом случае сбрасывает штатные единицы у таких
        позиций, API — нет.
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobUpsertRequest'
            example:
              status: open
              jobType:
                name: ИТ-подбор
              name: Разработчик
              description: ''
              comment: ''
              fromDate: '2024-04-24T07:55:10.461Z'
              toDate: '2024-04-24T07:55:10.461Z'
              plannedToDate: '2024-04-24T07:55:10.461Z'
              responsibleAccount:
                userName: example@friend.work
              teamMembers:
                - userName: assistant@friend.work
                  functionTypeName: Сотрудник
              suspensePeriods:
                - fromDate: '2024-04-24T07:55:10.461Z'
                  toDate: '2024-04-24T07:55:10.461Z'
                  comment: ''
                  suspendReason: ''
              positionCount: 10
              organizationUnit:
                id: 1001
              staffPositions:
                - id: 2001
                - foreignKey: 4f8c07e4-b440-4e35-9c32-03d066c30f27
      responses:
        '200':
          description: Вакансия изменена, тело ответа пустое.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEditJobs'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Вакансии
      summary: Изменение отдельных полей вакансии
      operationId: patchJob
      description: |
        Частично обновляет вакансию с помощью JSON Patch.

        Тело запроса соответствует RFC 6902 со следующими ограничениями:

        - поддерживаются только операции `add`, `replace` и `remove`;
        - операция `remove` поддерживается только для полей, которые могут принимать `null`;
        - операция `add` применяется только к коллекциям;
        - синтаксис индексов массивов не поддерживается, например `/employeeAccounts/0/id`;
        - операции `copy`, `move` и `test` не поддерживаются.

        PATCH-документ применяется не к объекту, который возвращает `GET /jobs/{jobId}`,
        а к структуре запроса полного обновления вакансии, то есть к полям `PUT /jobs/{jobId}`.

        Например, чтобы перевести вакансию в статус `onHold` и изменить плановую дату закрытия,
        достаточно передать две операции:

        ```json
        [
          { "op": "replace", "path": "/status", "value": "onHold" },
          { "op": "replace", "path": "/plannedToDate", "value": "2019-07-27T00:00:00" }
        ]
        ```

        Для сложных объектов можно заменить объект целиком или отдельное поле. Для `jobType`
        значения `id` и `name` взаимоисключающие: не передавайте их одновременно.

        Замена или удаление `/organizationUnit` не затрагивает позиции вакансии. Если у позиции
        указана штатная единица прежнего подразделения, связь сохраняется, запрос выполняется
        успешно. Интерфейс в этом случае сбрасывает штатные единицы у таких позиций, API — нет.
      parameters:
