  /jobs/{jobId}/positions:
    get:
      tags:
        - Позиции
      summary: Получение позиций вакансии
      operationId: getJobPositions
      description: |
        > **Скоро появится.** Метод описывает будущий контракт и пока недоступен в текущей версии API.

        Возвращает активные позиции вакансии.

        Вакансия должна существовать и быть доступна текущему пользователю для просмотра.
        Позиции возвращаются в порядке даты открытия `openedAt`, затем по идентификатору `id`.
        Если у вакансии нет активных позиций, API возвращает `200 OK` и пустой массив `[]`.
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '200':
          description: Активные позиции вакансии.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobPosition'
              example:
                - id: 501
                  staffPosition:
                    id: 2001
                    name: Кассир
                    foreignKey: 01881432-12a2-40cf-925b-509beac3694c
                  positionOpeningReason:
                    id: 10
                    name: Расширение штата
                    state: 0
                    createdAt: '2024-04-01T10:00:00Z'
                    updatedAt: '2024-04-01T10:00:00Z'
                  responsible:
                    id: 3820
                    userName: example@friend.work
                    firstName: Артём
                    lastName: Фёдоров
                  openedAt: '2024-04-24T07:55:10.461Z'
                  comment: Новая торговая точка
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenViewJobs'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Позиции
      summary: Создание позиций вакансии
      operationId: createJobPositions
      description: |
        > **Скоро появится.** Метод описывает будущий контракт и пока недоступен в текущей версии API.

        Добавляет новые позиции к вакансии. Метод не заменяет и не удаляет уже существующие позиции.

        За один запрос можно создать не более 100 позиций. Если `positions` не передан
        или передан пустой массив, данные не изменяются, а API возвращает `200 OK` без тела ответа.

        Для каждой позиции обязательно передайте `openedAt`. Длина `comment` не должна превышать
        2000 символов.

        Необязательные связи:

        - `staffPosition` — штатная единица. Передайте `id` в FriendWork или `foreignKey`
          штатной единицы в системе клиента;
        - `positionOpeningReason` — причина открытия позиции. Передайте `id` или `name`;
        - `responsible` — ответственный пользователь. Передайте `id` или `userName`.

        Переданные штатные единицы и причины открытия должны быть активными.
        Ответственный пользователь должен принадлежать компании и не быть заблокированным.
        Если работа со штатными единицами недоступна компании, передача `staffPosition`
        вернет ошибку.

        Если связь не нужна, не передавайте соответствующее поле или передайте `null`.

        `staffPosition` может не относиться к подразделению вакансии — API принимает такую
        связь без ошибки, но создавать её не рекомендуется.

        API возвращает `400 Bad Request`, если:

        - вакансия не найдена;
        - штатная единица или причина открытия не найдена либо находится в архиве;
        - ответственный пользователь не найден.
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPositionsCreateRequest'
            example:
              positions:
                - staffPosition:
                    foreignKey: 01881432-12a2-40cf-925b-509beac3694c
                  positionOpeningReason:
                    name: Расширение штата
                  responsible:
                    userName: example@friend.work
                  openedAt: '2024-04-24T07:55:10.461Z'
                  comment: Новая торговая точка
      responses:
        '200':
          description: Позиции созданы, тело ответа пустое.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEditJobs'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Позиции
      summary: Обновление позиций вакансии
      operationId: updateJobPositions
      description: |
        > **Скоро появится.** Метод описывает будущий контракт и пока недоступен в текущей версии API.

        Обновляет существующие позиции вакансии. Метод изменяет только позиции, переданные в запросе,
        и не удаляет остальные активные позиции вакансии.

        Если `positions` не передан или передан пустой массив, данные не изменяются,
        а API возвращает `200 OK` без тела ответа.

        Для каждой позиции обязательно передайте:

        - `id` — идентификатор активной позиции этой вакансии;
        - `openedAt` — дату открытия позиции.

        Идентификаторы позиций не должны повторяться. Длина `comment` не должна превышать
        2000 символов.

        Для `positionOpeningReason` и `responsible` тело запроса является целевым состоянием:
        если поле не передано или передано как `null`, соответствующая связь будет очищена.

        Для `staffPosition` действует то же правило, если компании доступна работа со штатными
        единицами. Если работа со штатными единицами недоступна, передача `staffPosition`
        вернет ошибку, а существующая связь со штатной единицей сохранится.

        Нельзя назначить архивную штатную единицу, архивную причину открытия или заблокированного
        пользователя. Текущие архивные или заблокированные значения можно оставить без изменений.

        `staffPosition` может не относиться к подразделению вакансии — API принимает такую
        связь без ошибки, но создавать её не рекомендуется.

        API возвращает `400 Bad Request`, если:

        - вакансия или одна из позиций не найдена;
        - позиция не принадлежит указанной вакансии или находится в архиве;
        - идентификаторы позиций повторяются либо данные одной из позиций не соответствуют контракту;
        - передан неизвестный или архивный связанный объект либо заблокированный ответственный.
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPositionsUpdateRequest'
            example:
              positions:
                - id: 501
                  staffPosition:
                    id: 2002
                  positionOpeningReason: null
                  responsible:
                    userName: example@friend.work
                  openedAt: '2024-05-01T09:00:00Z'
                  comment: Перенесена на другую штатную единицу
      responses:
        '200':
          description: Позиции обновлены, тело ответа пустое.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEditJobs'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Позиции
      summary: Удаление позиций вакансии
      operationId: deleteJobPositions
      description: |
        > **Скоро появится.** Метод описывает будущий контракт и пока недоступен в текущей версии API.

        Архивирует активные позиции вакансии по идентификаторам.

        Если `positionIds` не передан или передан пустой массив, данные не изменяются,
        а API возвращает `200 OK` без тела ответа.

        Все идентификаторы должны быть положительными и принадлежать активным позициям
        указанной вакансии.

        API возвращает `400 Bad Request`, если:

        - вакансия или одна из позиций не найдена;
        - позиция не принадлежит указанной вакансии или уже находится в архиве;
        - передан неположительный или повторяющийся идентификатор позиции.
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPositionsDeleteRequest'
            example:
              positionIds:
                - 501
                - 502
      responses:
        '200':
          description: Позиции удалены, тело ответа пустое.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenEditJobs'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /Api/Company/OrganizationUnits:
    put:
      tags:
        - Организационная структура
      summary: Создание и обновление организационных единиц
      operationId: upsertOrganizationUnits
      description: |
        Создает и обновляет организационные единицы компании: юридические лица,
        подразделения, отделы, департаменты и другие элементы структуры.

        На пути снизу вверх по каждой ветви организационной структуры не может быть более одного
        объекта с признаком юридического лица `isLegalEntity=true`.

        Для каждого корневого элемента передавайте `isLegalEntity=true`. Для некорневых элементов
        передавайте `isLegalEntity=false` или не передавайте поле. Контроль ограничения по одному
        юридическому лицу в ветви остается на стороне клиента.

        Запрос считается корректным, если одновременно выполняются условия:

        - `organizationUnits` передан и соответствует описанной структуре;
        - `foreignKey`, `parentForeignKey`, `lineManagerStaffPositionForeignKey` не пустые,
          если соответствующие поля переданы, и не длиннее 36 символов;
        - `name` не пустой;
        - каждый `foreignKey` указан в запросе только один раз;
        - если переданы `meta.customFields`, все `systemName` не пустые и не длиннее 255 символов.

        В остальных случаях API возвращает результат с ошибкой сохранения или редактирования данных.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUnitsUpsertRequest'
            example:
              organizationUnits:
                - timestamp: 1613479645000
                  foreignKey: '101'
                  name: Подразделение 1
                  startedAt: '2021-01-21T00:00:00'
                  closedAt: '2021-01-21T00:00:00'
                  parentForeignKey: '100'
                  lineManagerStaffPositionForeignKey: '201'
                  state: 0
                  isLegalEntity: false
                  meta:
                    customFields:
                      - systemName: Key1
                        value: Значение поля
                        values:
                          - Значение 1
                          - Значение 2
      responses:
        '200':
          $ref: '#/components/responses/OrganizationStructureApiResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /Api/Company/OrganizationUnits/State:
    put:
      tags:
        - Организационная структура
      summary: Архивирование и разархивирование организационных единиц
      operationId: changeOrganizationUnitsState
      description: |
        Изменяет состояние организационных единиц.

        Передавайте `state=1`, чтобы архивировать организационную единицу, и `state=0`,
        чтобы вернуть её в активное состояние.

        Запрос считается корректным, если `organizationUnits` передан, содержит хотя бы один элемент
        и соответствует описанной структуре. Иначе API возвращает общую ошибку API.

        Все `foreignKey` должны быть ранее добавлены в систему и принадлежать организационным
        единицам. Иначе API возвращает ошибку сохранения или редактирования данных.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUnitsStateRequest'
            example:
              organizationUnits:
                - timestamp: 1613479645000
                  foreignKey: '101'
                  state: 1
      responses:
        '200':
          $ref: '#/components/responses/OrganizationStructureApiResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
