        - `employees` передан и соответствует описанной структуре;
        - все `foreignKey` не пустые и не длиннее 36 символов;
        - `personnelNumber`, `firstName` и `lastName` не пустые;
        - каждый `foreignKey` указан в запросе только один раз.

        В остальных случаях API возвращает результат с ошибкой сохранения или редактирования данных.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeesUpsertRequest'
            example:
              employees:
                - timestamp: 1613479645000
                  foreignKey: '301'
                  personnelNumber: '1592'
                  hiredAt: '2021-01-21T00:00:00'
                  email: example@friend.work
                  gender: 0
                  lastName: Фамилия
                  firstName: Имя
                  middleName: Отчество
                  phone: '+79001112233'
                  birthdate: '2021-01-21T00:00:00'
                  timeZone: 120
                  state: 0
                  meta:
                    customFields:
                      - systemName: Key1
                        value: Значение поля
                        values:
                          - Значение 1
                          - Значение 2
      responses:
        '200':
          $ref: '#/components/responses/OrganizationStructureApiResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /Api/Company/Assignments:
    put:
      tags:
        - Организационная структура
      summary: Создание и обновление назначений
      operationId: upsertEmployeeAssignments
      description: |
        Создает и обновляет назначения сотрудников на штатные единицы.

        При передаче назначений учитывайте следующие правила:

        - с сотрудником может быть связана только одна активная штатная единица;
        - штатные единицы одного сотрудника не могут относиться к разным юридическим лицам
          в родительской цепочке;
        - если пользователь должен работать на штатных единицах разных юридических лиц,
          для каждой штатной единицы создайте отдельный аккаунт.

        Запрос считается корректным, если одновременно выполняются условия:

        - `assignments` передан и соответствует описанной структуре;
        - `foreignKey`, `employeeForeignKey`, `staffPositionForeignKey` не пустые и не длиннее 36 символов;
        - `startedAt` не пустой;
        - каждый `foreignKey` указан в запросе только один раз.

        В остальных случаях API возвращает результат с ошибкой сохранения или редактирования данных.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentsUpsertRequest'
            example:
              assignments:
                - timestamp: 1613479645000
                  foreignKey: '801'
                  employeeForeignKey: '301'
                  staffPositionForeignKey: '201'
                  startedAt: '2021-01-21T00:00:00'
                  endedAt: '2021-01-21T00:00:00'
                  probationPeriodStartedAt: '2021-01-21T00:00:00'
                  probationPeriodEndedAt: '2021-01-21T00:00:00'
                  state: 0
      responses:
        '200':
          $ref: '#/components/responses/OrganizationStructureApiResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /CustomFields/Values?objectType=job:
    put:
      tags:
        - Настраиваемые поля
      summary: Создание и обновление значений настраиваемых полей вакансии
      operationId: upsertJobCustomFieldValues
      description: |
        Создает или обновляет значения настраиваемых полей вакансии.

        Для обновления вакансии передайте:

        - `objectType=job`;
        - `objectId` — идентификатор вакансии;
        - `ShouldUpdateOnlySpecifiedSystemNames` — режим обновления;
        - `CustomFields` — значения настраиваемых полей.

        Если `ShouldUpdateOnlySpecifiedSystemNames=true`, обновляются только поля,
        явно указанные в `CustomFields`. Если `false`, все неуказанные значения полей удаляются.

        В каждом элементе `CustomFields` поле определяется по `systemName`.
        Для поля с одним значением передавайте `value`, для поля с несколькими значениями — `values`.
        Не передавайте `value` и `values` одновременно.
      parameters:
        - name: objectType
          in: query
          required: true
          description: Тип объекта. Для вакансий передавайте `job`.
          schema:
            type: string
            enum:
              - job
          example: job
        - name: objectId
          in: query
          required: true
          description: Идентификатор вакансии.
          schema:
            type: integer
            format: int32
            minimum: 1
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCustomFieldsRequest'
            example:
              ShouldUpdateOnlySpecifiedSystemNames: true
              CustomFields:
                - systemName: JobCustomField1
                  value: '15'
                - systemName: JobCustomField2
                  values:
                    - '1'
                    - '2'
      responses:
        '200':
          description: Результат обработки значений настраиваемых полей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
              examples:
                success:
                  summary: Значения сохранены
                  value:
                    Code: 0
                invalidRequest:
                  summary: Неверный формат запроса
                  value:
                    Code: 1
                    Message: Неверный формат запроса.
                invalidData:
                  summary: Ошибка данных
                  value:
                    Code: 3
                    Message: Не обнаружена вакансия с указанным идентификатором или передано некорректное значение поля.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /CustomFields/Values:
    put:
      tags:
        - Настраиваемые поля
      summary: Создание и обновление значений настраиваемых полей организационной структуры
      operationId: upsertOrganizationStructureCustomFieldValues
      description: |
        Создает или обновляет значения настраиваемых полей объекта.

        Для объектов организационной структуры передавайте числовой `objectType`:

        - `50` — организационная единица;
        - `51` — штатная единица;
        - `52` — сотрудник.

        Если `objectId` передан, обновляются значения одного объекта. Для объектов организационной
        структуры `objectId` должен быть равен `foreignKey` ранее загруженного объекта.

        Если `objectId` не передан, используется пакетное обновление значений для коллекции объектов:
        в теле запроса передается `Items`.

        Для пакетного обновления значений объектов организационной структуры `objectType` должен быть
        равен `50`, `51` или `52`. Все `Items[].ObjectId` должны соответствовать ранее загруженным
        `foreignKey` объектов выбранного типа. Иначе API возвращает ошибку сохранения или редактирования данных.

        Если `ShouldUpdateOnlySpecifiedSystemNames=true`, обновляются только поля,
        явно указанные в `CustomFields`. Если `false`, все неуказанные значения полей удаляются.

        В каждом элементе `CustomFields` поле определяется по `systemName`.
        Для поля с одним значением передавайте `value`, для поля с несколькими значениями — `values`.
        Не передавайте `value` и `values` одновременно.
      parameters:
        - name: objectType
          in: query
          required: true
          description: |
            Тип объекта организационной структуры:

            - `50` — организационная единица;
            - `51` — штатная единица;
            - `52` — сотрудник.
          schema:
            type: integer
            format: int32
            enum:
              - 50
              - 51
              - 52
          example: 50
        - name: objectId
          in: query
          required: false
          description: |
            Идентификатор объекта.

            Передавайте `foreignKey` организационной единицы, штатной единицы или сотрудника.

            Если параметр не передан, API ожидает пакетное тело запроса с `Items`.
          schema:
            type: string
            minLength: 1
            maxLength: 36
          example: '301'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CustomFieldsValuesRequest'
                - $ref: '#/components/schemas/CustomFieldsValuesBatchRequest'
            examples:
              singleObject:
                summary: Значения одного объекта
                value:
                  ShouldUpdateOnlySpecifiedSystemNames: true
                  CustomFields:
                    - systemName: Key1
                      value: Значение поля
                    - systemName: Key2
                      values:
                        - Значение 1
                        - Значение 2
              objectCollection:
                summary: Значения коллекции объектов
                value:
                  Items:
                    - ObjectId: '301'
                      CustomFields:
                        - systemName: Key1
                          value: Значение поля
      responses:
        '200':
          $ref: '#/components/responses/OrganizationStructureApiResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Настраиваемые поля
      summary: Удаление значений настраиваемых полей организационной структуры
      operationId: deleteOrganizationStructureCustomFieldValues
      description: |
        Удаляет значения настраиваемых полей объекта организационной структуры.

        Для объектов организационной структуры передавайте числовой `objectType`:

        - `50` — организационная единица;
        - `51` — штатная единица;
        - `52` — сотрудник.

        `objectId` должен быть равен `foreignKey` ранее загруженного объекта.

        Если параметр `objectId` не передан, API возвращает `405 Method Not Allowed`.
      parameters:
        - name: objectType
          in: query
          required: true
          description: Тип объекта организационной структуры.
          schema:
            type: integer
            format: int32
            enum:
              - 50
              - 51
              - 52
          example: 50
        - name: objectId
          in: query
          required: true
          description: Внешний идентификатор объекта в системе клиента.
          schema:
            type: string
            minLength: 1
            maxLength: 36
          example: '101'
      responses:
        '200':
          $ref: '#/components/responses/OrganizationStructureApiResultResponse'
        '405':
          description: Параметр `objectId` не указан.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
      description: Передайте API-токен в заголовке `Authorization` в формате `Bearer {apiToken}`.
  parameters:
    AccountIdPath:
      name: accountId
      in: path
      required: true
      description: Идентификатор аккаунта.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 123
    JobIdPath:
      name: jobId
      in: path
      required: true
      description: Идентификатор вакансии. Значение должно быть больше нуля.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 1
    CandidateIdPath:
      name: candidateId
      in: path
      required: true
      description: Идентификатор кандидата. Значение должно быть больше нуля.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 123
    CandidateDisqualificationIdPath:
      name: id
      in: path
      required: true
      description: Идентификатор отказа. Значение должно быть больше нуля.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 445
    CandidateHistoryIdQuery:
      name: candidateHistoryId
      in: query
      required: true
      description: Идентификатор истории кандидата. Значение должно быть больше нуля.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 23
    WebhookIdQuery:
      name: id
      in: query
      required: true
      description: Идентификатор вебхука.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 443
  responses:
    BadRequest:
      description: Некорректный формат запроса или некорректные данные в запросе.
    NotFound:
      description: Объект не найден или принадлежит другому клиенту.
    Unauthorized:
      description: Запрос выполнен без авторизации или с недействительным API-токеном.
      headers:
        WWW-Authenticate:
          description: Схема авторизации `Bearer`.
          schema:
            type: string
            example: Bearer
    TooManyRequests:
      description: Превышен лимит частоты запросов.
    PublicApiValidationError:
      description: Запрос не прошел валидацию.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc7231#section-6.5.1
            title: One or more validation errors occurred.
            status: 400
            traceId: 4f9b7a2c8d2e4c6fa1b3c5d7e9f01234
            errors:
              Paging.PerPage:
                - The field PerPage must be between 1 and 500.
    PublicApiCreateAccountBadRequest:
      description: Некорректные данные аккаунта или запрос не прошел валидацию.
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            validationError:
              summary: Ошибка валидации поля
              value:
                type: https://tools.ietf.org/html/rfc7231#section-6.5.1
                title: One or more validation errors occurred.
                status: 400
                instance: /api/v2/accounts
                traceId: 4f9b7a2c8d2e4c6fa1b3c5d7e9f01234
                errors:
                  UserName:
                    - userName must be a valid email address.
            businessError:
              summary: Пароль не соответствует требованиям
              value:
                type: https://tools.ietf.org/html/rfc7231#section-6.5.1
                title: Bad Request
                status: 400
                detail: Password does not meet security requirements.
                instance: /api/v2/accounts
                traceId: 4f9b7a2c8d2e4c6fa1b3c5d7e9f01234
    PublicApiUnauthorized:
      description: API-токен отсутствует, недействителен, истек или отозван.
      headers:
        WWW-Authenticate:
          description: Схема авторизации `Bearer`.
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc7235#section-3.1
            title: Unauthorized
            status: 401
            detail: Authentication is required.
            traceId: 4f9b7a2c8d2e4c6fa1b3c5d7e9f01234
    PublicApiForbidden:
      description: Пользователь не является администратором или операция управления аккаунтами недоступна.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc7231#section-6.5.3
            title: Forbidden
            status: 403
            detail: Insufficient permissions.
            traceId: 4f9b7a2c8d2e4c6fa1b3c5d7e9f01234
    PublicApiNotFound:
      description: Аккаунт не найден или принадлежит другой компании.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc7231#section-6.5.4
            title: Not Found
            status: 404
            detail: Account was not found.
            traceId: 4f9b7a2c8d2e4c6fa1b3c5d7e9f01234
    PublicApiConflict:
      description: Запрос конфликтует с текущим состоянием или тарифными ограничениями.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc7231#section-6.5.8
            title: Conflict
            status: 409
            detail: Account with the same userName already exists.
            traceId: 4f9b7a2c8d2e4c6fa1b3c5d7e9f01234
    PublicApiTooManyRequests:
      description: Превышен лимит частоты запросов.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Too Many Requests
            status: 429
            detail: Too many requests.
            traceId: 4f9b7a2c8d2e4c6fa1b3c5d7e9f01234
    PublicApiInternalServerError:
      description: Непредвиденная ошибка при обработке запроса.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc7231#section-6.6.1
            status: 500
            detail: Unexpected error occurred.
            traceId: 4f9b7a2c8d2e4c6fa1b3c5d7e9f01234
    OrganizationStructureApiResultResponse:
      description: Результат обработки запроса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationStructureApiResult'
          examples:
            success:
              summary: Успешная обработка
              value:
                Code: 0
                Message: null
            invalidRequest:
              summary: Общая ошибка API
              value:
                Code: 1
                Message: Неверный формат запроса.
            dataSaveError:
              summary: Ошибка данных
              value:
                Code: 3
                Message: Ошибка при сохранении или редактировании данных.
            batchAccepted:
              summary: Пакет получен
              value:
                Code: 0
                Message: null
                Body:
                  TransferId: 22c85210-43ee-4ea7-aee3-de3f0a7c6dba
                  BatchesTotalCount: 2
                  Status: 0
                  ReceivedBatchNumbers:
                    - 1
    ForbiddenViewJobs:
      description: У пользователя нет права на просмотр вакансий.
    ForbiddenCreateJobs:
      description: У пользователя нет права на создание вакансий.
    ForbiddenEditJobs:
      description: У пользователя нет права редактировать вакансии.
    ForbiddenDeleteJobs:
      description: У пользователя нет права удалять вакансии.
  schemas:
    ProblemDetails:
      type: object
      description: Стандартное описание ошибки в формате RFC 7807.
      properties:
        type:
          type: string
          nullable: true
          description: URI типа ошибки.
        title:
          type: string
          nullable: true
          description: Краткое название ошибки.
        status:
          type: integer
          format: int32
          nullable: true
          description: HTTP-статус ошибки.
        detail:
          type: string
          nullable: true
          description: Описание причины ошибки.
        instance:
          type: string
          nullable: true
          description: Путь запроса, при обработке которого произошла ошибка.
        traceId:
          type: string
          nullable: true
          description: Идентификатор запроса для обращения в поддержку.
    ValidationProblemDetails:
      description: Ошибка валидации параметров или полей запроса.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              description: Ошибки, сгруппированные по именам полей.
              additionalProperties:
                type: array
                items:
                  type: string
    RolePublicApiResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int32
          description: Идентификатор роли.
          example: 12
        name:
          type: string
          nullable: true
          description: Название роли.
          example: Рекрутер
    CreateAccountPublicApiRequest:
      type: object
      required:
        - userName
      description: |
        Данные нового аккаунта. Необходимо передать непустое значение хотя бы одного поля:
        `firstName` или `lastName`.
      properties:
        userName:
          type: string
          format: email
          minLength: 1
          description: Email аккаунта. Перед сохранением приводится к нижнему регистру.
          example: anna.ivanova@example.com
        firstName:
          type: string
          nullable: true
          description: Имя пользователя.
          example: Анна
        lastName:
          type: string
          nullable: true
          description: Фамилия пользователя.
          example: Иванова
        phone:
          type: string
          nullable: true
          description: Телефон пользователя.
          example: '+79990000000'
        password:
          type: string
          format: password
          writeOnly: true
          nullable: true
          description: |
            Пароль аккаунта. Если поле не передано, равно `null`, пусто или состоит только из
            пробелов, пароль генерируется автоматически. Иначе пароль должен содержать не менее
            8 символов и символы как минимум трех категорий: строчные буквы, заглавные буквы,
            цифры и специальные символы.
          example: StrongPass1!
        roleId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: |
            Идентификатор роли текущей компании. Значения `0` и `null` создают аккаунт без
            назначенной роли, то есть администратора.
          example: 12
        customerId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: |
            Идентификатор неудаленного заказчика текущей компании. Значения `0` и `null`
            оставляют аккаунт без заказчика.
          example: 34
        sendWelcomeEmail:
          type: boolean
          nullable: true
          default: false
          description: Отправить приветственное письмо после создания аккаунта.
    PatchAccountPublicApiRequest:
      type: array
      minItems: 1
      description: Непустой JSON Patch-документ с разрешенными изменениями аккаунта.
      items:
        $ref: '#/components/schemas/AccountJsonPatchOperation'
    AccountJsonPatchOperation:
      description: Операция изменения аккаунта. Регистр значения `path` имеет значение.
      oneOf:
        - type: object
          title: Удаление значения
          required:
            - op
            - path
          properties:
            op:
              type: string
              enum:
                - remove
            path:
              type: string
              enum:
                - /firstName
                - /lastName
                - /phone
                - /roleId
                - /customerId
              description: Поле, значение которого нужно удалить.
        - type: object
          title: Изменение логина
          required:
            - op
            - path
            - value
          properties:
            op:
              type: string
              enum:
                - replace
            path:
              type: string
              enum:
                - /userName
            value:
              type: string
              description: Новый логин аккаунта.
        - type: object
          title: Изменение строкового поля
          required:
            - op
            - path
            - value
          properties:
            op:
              type: string
              enum:
                - replace
            path:
              type: string
              enum:
                - /firstName
                - /lastName
                - /phone
            value:
              type: string
              nullable: true
              description: Новое строковое значение или `null`.
        - type: object
          title: Изменение идентификатора
          required:
            - op
            - path
            - value
          properties:
            op:
              type: string
              enum:
                - replace
            path:
              type: string
              enum:
                - /roleId
                - /customerId
            value:
              type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              nullable: true
              description: Новый идентификатор, `0` или `null`.
    AccountsPageResponse:
      type: object
      required:
        - items
        - total
        - page
        - perPage
      properties:
        items:
          type: array
          description: Аккаунты текущей страницы.
          items:
            $ref: '#/components/schemas/AccountPublicApiResponse'
        total:
          type: integer
          format: int32
          minimum: 0
          description: Общее количество аккаунтов после применения фильтров.
          example: 4366
        page:
          type: integer
          format: int32
          minimum: 1
          description: Номер текущей страницы.
          example: 1
        perPage:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          description: Запрошенное количество аккаунтов на странице.
          example: 20
    AccountPublicApiResponse:
      type: object
      required:
        - accountId
        - userName
        - isBlocked
        - createdAt
      properties:
        accountId:
          type: integer
          format: int32
          description: Идентификатор аккаунта.
          example: 123
        userName:
          type: string
          description: Логин аккаунта.
          example: anna.ivanova@example.com
        firstName:
          type: string
          nullable: true
          description: Имя пользователя.
          example: Анна
        lastName:
          type: string
          nullable: true
          description: Фамилия пользователя.
          example: Иванова
        phone:
          type: string
          nullable: true
          description: Телефон пользователя.
          example: '+79990000000'
        isBlocked:
          type: integer
          format: int32
          enum:
            - 0
            - 1
          description: Состояние аккаунта. `0` — активен, `1` — заблокирован.
          example: 0
        createdAt:
          type: string
          description: |
            Дата и время создания аккаунта в том виде, в котором значение хранится в FriendWork.
            Часовой пояс не добавляется и преобразование времени не выполняется.
          example: '2026-08-19T10:15:00'
        department:
          type: string
          nullable: true
          description: Название подразделения аккаунта.
          example: Подбор персонала
        role:
          type: object
          nullable: true
          description: |
            Назначенная роль. `null` означает отсутствие назначенной роли; такой аккаунт обладает
            административными правами.
          oneOf:
            - $ref: '#/components/schemas/RolePublicApiResponse'
            - type: object
              nullable: true
              enum:
                - null
        customer:
          description: Заказчик, назначенный аккаунту.
          allOf:
            - $ref: '#/components/schemas/CustomerPublicApiResponse'
        organizationUnit:
          description: Организационная единица аккаунта.
          allOf:
            - $ref: '#/components/schemas/OrganizationUnitPublicApiResponse'
        settings:
          description: Публичные настройки аккаунта.
          allOf:
            - $ref: '#/components/schemas/AccountSettingsPublicApiResponse'
    CustomerPublicApiResponse:
      type: object
      nullable: true
      required:
        - id
      properties:
        id:
          type: integer
          format: int32
          description: Идентификатор заказчика.
          example: 34
        name:
