            в системе устанавливается текущая дата и время.
          example: '2021-01-21T00:00:00'
        closedAt:
          type: string
          nullable: true
          description: Дата окончания действия организационной единицы.
          example: '2021-01-21T00:00:00'
        parentForeignKey:
          type: string
          minLength: 1
          maxLength: 36
          nullable: true
          description: |
            Внешний ключ родительской организационной единицы. У корневых элементов поле
            должно отсутствовать или иметь значение `null`, не строку `"null"`.
        lineManagerStaffPositionForeignKey:
          type: string
          minLength: 1
          maxLength: 36
          nullable: true
          description: Внешний ключ штатной единицы линейного руководителя.
        state:
          type: integer
          nullable: true
          oneOf:
