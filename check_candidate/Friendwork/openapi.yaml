            или `foreignKey` в системе клиента.

            Если коллекция передана, нужно также передать `organizationUnit`.
            Все штатные единицы должны относиться к указанному подразделению.
          items:
            $ref: '#/components/schemas/OrganizationStructureItemIdentifierRequest'
    JobStatus:
