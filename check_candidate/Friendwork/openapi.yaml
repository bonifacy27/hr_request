                    functionTypeId: 6459
                    functionTypeName: Сотрудник
                suspensePeriods:
                  - fromDate: Mon Mar 23 2020
                    toDate: Mon Mar 23 2020
                    comment: null
                    suspendReason: null
                positionCount: 10
                organizationUnit:
                  id: 1001
                  name: Розница
                  foreignKey: 947d1c55-741f-4780-84f1-2410e563c488
                staffPositions:
                  - id: 2001
                    name: Кассир
                    foreignKey: 01881432-12a2-40cf-925b-509beac3694c
                  - id: 2002
                    name: Администратор торгового зала
                    foreignKey: 4f8c07e4-b440-4e35-9c32-03d066c30f27
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
