    AccountSettingsPublicApiResponse:
      type: object
      nullable: true
      required:
        - useCurrentWindow
        - resetSearchFilter
        - isEmailSignatureActive
        - signatureContent
        - frontendType
        - language
        - feedSettings
        - candidatesViewSettings
        - isConfirmedAdditionalAgreement
      properties:
        useCurrentWindow:
          type: boolean
          description: Открывать действия в текущем окне.
        resetSearchFilter:
          type: boolean
          description: Сбрасывать фильтр поиска.
        isEmailSignatureActive:
          type: boolean
          description: Использовать подпись в письмах.
        signatureContent:
          type: string
          description: Содержимое подписи.
        showCandidateHistoryCount:
          type: integer
          format: int32
          nullable: true
          description: Количество отображаемых записей истории кандидата.
        frontendType:
          type: integer
          format: int32
          description: Тип пользовательского интерфейса.
        language:
          type: integer
          format: int32
          enum:
            - 0
            - 1
          description: Язык интерфейса. `0` — русский, `1` — английский.
        isHiddenSubstatuses:
          type: boolean
          nullable: true
          description: Скрыты ли подстатусы.
        feedSettings:
          type: integer
          format: int32
